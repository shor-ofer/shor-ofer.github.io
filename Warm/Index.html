<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Warm the Worm</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1a1024;
    display: flex; flex-direction: column; align-items: center;
    font-family: -apple-system, system-ui, sans-serif;
    overflow: hidden; touch-action: none; user-select: none;
  }
  h1 {
    color: #ffcf8a; font-size: 18px; margin: 10px 0 4px;
    letter-spacing: 1px;
  }
  #wrap {
    width: 100%; max-width: 640px; padding: 0 10px;
    display: flex; flex-direction: column; align-items: center;
  }
  #stage {
    width: 100%; border-radius: 10px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    border: 3px solid #4a3560;
  }
  canvas { display: block; width: 100%; height: auto; background: #cfe8ff; }
  #controls {
    width: 100%; display: flex; justify-content: space-between;
    align-items: center; margin-top: 14px; padding: 0 4px;
  }
  .dbtn {
    width: 62px; height: 62px; border-radius: 50%;
    background: linear-gradient(145deg, #ff9d4d, #e8752a);
    border: none; color: white; font-size: 26px; font-weight: bold;
    box-shadow: 0 4px 0 #b8541a, 0 6px 10px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
  }
  .dbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b8541a; }
  #jumpBtn {
    width: 78px; height: 78px;
    background: linear-gradient(145deg, #ffd35a, #e8a812);
    box-shadow: 0 4px 0 #b0800b, 0 6px 10px rgba(0,0,0,0.3);
    font-size: 15px;
  }
  #moveGroup { display: flex; gap: 12px; }
  #status { color: #cbb8e0; font-size: 12px; margin-top: 8px; height: 16px; }
  #stage { position: relative; }
  #score {
    position: absolute; top: 8px; left: 8px;
    background: rgba(26,16,36,0.65);
    color: #ffd35a; font-weight: bold; font-size: 15px;
    padding: 5px 12px; border-radius: 8px;
    letter-spacing: 0.5px;
    pointer-events: none;
  }
  #lives {
    position: absolute; top: 8px; right: 8px;
    background: rgba(26,16,36,0.65);
    color: #ff6b6b; font-weight: bold; font-size: 15px;
    padding: 5px 12px; border-radius: 8px;
    letter-spacing: 0.5px;
    pointer-events: none;
  }
  .overlay {
    position: absolute; inset: 0;
    background: rgba(20,12,28,0.82);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 12px;
    overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  }
  .overlay h2 {
    color: #ffd35a; font-size: 20px; margin: 0;
  }
  .overlay p {
    color: #e8dcf5; font-size: 13px; margin: 0;
  }
  .bigbtn {
    min-width: 160px; padding: 10px 20px; border-radius: 10px;
    border: none; font-size: 15px; font-weight: bold; color: white;
    background: linear-gradient(145deg, #ff9d4d, #e8752a);
    box-shadow: 0 4px 0 #b8541a, 0 6px 10px rgba(0,0,0,0.3);
    flex-shrink: 0;
  }
  .bigbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b8541a; }
  .bigbtn.secondary {
    background: linear-gradient(145deg, #8a6fd6, #5f43ad);
    box-shadow: 0 4px 0 #3e2c78, 0 6px 10px rgba(0,0,0,0.3);
  }
  .nameInput {
    width: 200px; max-width: 80%;
    padding: 10px 14px; border-radius: 8px;
    border: 1px solid rgba(255,211,90,0.4);
    background: rgba(0,0,0,0.25); color: #f0e6fb;
    font-size: 15px; text-align: center;
    outline: none;
    -webkit-user-select: text; user-select: text;
    touch-action: manipulation;
  }
  .nameInput::placeholder { color: #a893c2; }
  .hiscoreLine { min-height: 20px; width: 100%; max-width: 260px; }
  .hiscoreLine:empty { min-height: 0; }
  .hiscoreCard {
    background: linear-gradient(180deg, #2c1b40, #1f1230);
    border: 1px solid rgba(255,211,90,0.35);
    border-radius: 12px;
    padding: 10px 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .hiscoreTitle {
    color: #ffd35a; font-size: 17px; font-weight: bold;
    letter-spacing: 0.5px; margin-bottom: 6px;
  }
  .hiscoreRow {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 2px; font-size: 15px; color: #f0e6fb;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .hiscoreRow:first-of-type { border-top: none; }
  .hiscoreRank { display: flex; align-items: center; gap: 6px; }
  .hiscoreMedal { font-size: 17px; }
  .hiscoreScore { font-weight: bold; color: #ffd35a; }
  .hiscoreFallback { color: #cbb8e0; font-size: 14px; }
  .hiscoreLoading { color: #cbb8e0; font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <h1>🐛 Warm the Worm</h1>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="score">Score: 0</div>
    <div id="lives">♥ x3</div>

    <div id="startScreen" class="overlay">
      <h2>🐛 Warm the Worm</h2>
      <p>Stomp the beetles, avoid their sides, don't fall!</p>
      <input id="nameInput" class="nameInput" type="text" maxlength="14" placeholder="Your name" autocomplete="off">
      <button class="bigbtn" id="playBtn">▶ Play</button>
      <button class="bigbtn secondary" id="hiscoreBtn">🏆 High Score</button>
      <div id="hiscoreLine" class="hiscoreLine"></div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <h2>Game Over</h2>
      <p id="finalScoreLine">Score: 0</p>
      <p id="bestScoreLine">Best: 0</p>
      <button class="bigbtn" id="againBtn">↻ Play Again</button>
      <button class="bigbtn secondary" id="hiscoreBtnGameOver">🏆 High Score</button>
      <div id="hiscoreLineGameOver" class="hiscoreLine"></div>
    </div>
  </div>
  <div id="controls">
    <div id="moveGroup">
      <button class="dbtn" id="leftBtn">◀</button>
      <button class="dbtn" id="rightBtn">▶</button>
    </div>
    <button class="dbtn" id="jumpBtn">JUMP</button>
  </div>
  <div id="status">arrow keys / WASD also work — level scrolls now!</div>
</div>

<script>
// ---------- Tile map (built programmatically, wider than the viewport) ----------
const TILE = 32;
const cols = 60;      // level is much wider than what's on screen at once
const rows = 12;       // fits the screen height exactly, no vertical scroll needed
const VIEW_COLS = 20;  // visible tiles across
const DEPTH = 6;       // pseudo-3D extrusion depth in px
const grid = Array.from({ length: rows }, () => Array(cols).fill('.'));

function fillRect(row, colStart, colEnd) {
  for (let c = colStart; c <= colEnd; c++) grid[row][c] = '#';
}

// ground with a couple of gaps to jump over
fillRect(rows - 1, 0, cols - 1);
grid[rows - 1][15] = '.'; grid[rows - 1][16] = '.';
grid[rows - 1][35] = '.'; grid[rows - 1][36] = '.'; grid[rows - 1][37] = '.';

// scattered platforms across the level
fillRect(8, 5, 7);
fillRect(6, 12, 14);
fillRect(7, 19, 21);
fillRect(5, 25, 29);
fillRect(9, 40, 44);
fillRect(4, 46, 49);
fillRect(8, 52, 55);

// tunnel overhangs: non-solid decorative tiles placed right at worm height.
// They're rendered AFTER the worm (see drawTunnels), so the worm visually
// disappears behind/under them as it passes through — like ducking into a tunnel.
function fillTunnel(row, colStart, colEnd) {
  for (let c = colStart; c <= colEnd; c++) grid[row][c] = 'T';
}
fillTunnel(9, 8, 11);
fillTunnel(10, 8, 11);
fillTunnel(9, 30, 33);
fillTunnel(10, 30, 33);

// slopes: '/' is a solid ramp the worm climbs smoothly (its collision height
// rises gradually across the tile). 'D' is a down-slope that is NOT solid at
// all — stepping past the plateau edge onto it means there is nothing to
// stand on, so gravity takes over and the worm falls instead of sliding down.
function fillSlopeUp(row, col) { grid[row][col] = '/'; }
function fillSlopeDown(row, col) { grid[row][col] = 'D'; }

fillSlopeUp(10, 22);
fillRect(10, 23, 26);     // plateau reached by the ramp
fillSlopeDown(10, 27);    // she walks off here and drops — no ramp support

function solidAt(col, row) {
  if (row >= rows) return false;      // open bottom -> falling off triggers respawn
  if (row < 0 || col < 0 || col >= cols) return true; // walls/ceiling
  return grid[row][col] === '#';      // 'T' tunnel tiles are NOT solid — worm walks straight through
}

// For a given world x, find the sloped ground height if x sits over a '/'
// ramp tile. Returns null if there's no ramp there (flat ground/air/'D').
function rampSurfaceY(x) {
  const col = Math.floor(x / TILE);
  if (col < 0 || col >= cols) return null;
  for (let r = 0; r < rows; r++) {
    if (grid[r][col] === '/') {
      const localX = x - col * TILE;      // 0 (left/low) .. TILE (right/high)
      return (r + 1) * TILE - localX;
    }
  }
  return null;
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = VIEW_COLS * TILE;   // viewport size (what's shown)
canvas.height = rows * TILE;
const mapWidthPx = cols * TILE;

// ---------- Camera ----------
const cam = { x: 0, y: 0 };
function updateCamera() {
  cam.x = warm.x - canvas.width / 2;
  if (cam.x < 0) cam.x = 0;
  if (cam.x > mapWidthPx - canvas.width) cam.x = mapWidthPx - canvas.width;
  cam.y = 0;
}

// ---------- Warm (the worm) ----------
const START = { x: 3 * TILE + TILE / 2, y: 2 * TILE };
const R = 11;               // head radius
const GRAVITY = 0.55;
const MAX_FALL = 12;
const SPEED = 2.6;
const JUMP_V = -10.5;

const warm = { x: START.x, y: START.y, vx: 0, vy: 0, grounded: false };

// body: longer now. Each part's distance from the part before it is capped
// at its own radius, but parts have NO collision with each other — they can
// freely overlap/pass through one another when the worm curls up.
const SEGMENT_COUNT = 14;
const RADII = Array.from({ length: SEGMENT_COUNT }, (_, i) => {
  const t = i / (SEGMENT_COUNT - 1);
  return R * (1 - t * 0.68); // tapers from full head radius down to a thin tail
});
let segments = RADII.map(r => ({ x: START.x, y: START.y, vy: 0, r }));

let leftPressed = false, rightPressed = false, jumpPressed = false;

// only resets her position/body — does NOT touch score or lives
function resetPosition() {
  warm.x = START.x; warm.y = START.y; warm.vx = 0; warm.vy = 0;
  segments = RADII.map(r => ({ x: START.x, y: START.y, vy: 0, r }));
}

// ---------- Score, lives, game state, and generative sound ----------
let score = 0;
let lives = 3;
let gameState = 'start'; // 'start' | 'playing' | 'gameover'

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScoreLine = document.getElementById('finalScoreLine');
const bestScoreLine = document.getElementById('bestScoreLine');
const hiscoreLine = document.getElementById('hiscoreLine');
const hiscoreLineGameOver = document.getElementById('hiscoreLineGameOver');
const nameInput = document.getElementById('nameInput');

let playerName = 'Player';
try {
  const savedName = localStorage.getItem('warmWormPlayerName');
  if (savedName) { playerName = savedName; nameInput.value = savedName; }
} catch (e) { /* ignore */ }

function getHighScore() {
  try { return parseInt(localStorage.getItem('warmWormHighScore') || '0', 10); }
  catch (e) { return 0; }
}
function setHighScore(v) {
  try { localStorage.setItem('warmWormHighScore', String(v)); } catch (e) { /* ignore */ }
}

// ---------- Shared leaderboard (Supabase) ----------
// This version talks to Supabase directly over fetch(). That only works
// once this file is hosted somewhere outside claude.ai's artifact sandbox
// (GitHub Pages, Vercel, Netlify, any static host) — claude.ai artifacts
// block outbound requests like this, which is why the artifact version of
// this game uses the platform's own built-in database instead.
const SUPABASE_URL = 'https://rqwgltjoygomqfcmrtdh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Bq61t2RzKsn5K9pv9bWzyQ_sh8U-xoi';

// submits the score in the background; never awaited by the caller
function submitScoreToLeaderboard(finalScore) {
  fetch(SUPABASE_URL + '/rest/v1/leaderboard', {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({ score: finalScore, name: playerName })
  }).catch(() => { /* offline or unreachable — local high score still stands */ });
}

// fetches the top 5 global scores; resolves to null on any failure
async function fetchTopScores() {
  try {
    const res = await fetch(
      SUPABASE_URL + '/rest/v1/leaderboard?select=name,score&order=score.desc&limit=5',
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } }
    );
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

function updateHud() {
  scoreEl.textContent = 'Score: ' + score;
  livesEl.textContent = '♥ x' + lives;
}

// called when she touches an enemy from the side, or falls off the map
function loseLife() {
  lives--;
  playDeathSound();
  updateHud();
  if (lives <= 0) {
    gameState = 'gameover';
    const best = Math.max(score, getHighScore());
    setHighScore(best);
    finalScoreLine.textContent = 'Score: ' + score;
    bestScoreLine.textContent = 'Best: ' + best;
    gameOverScreen.classList.remove('hidden');
    submitScoreToLeaderboard(score); // fire-and-forget — doesn't hold up the screen above
  } else {
    resetPosition();
  }
}

function startGame() {
  const typed = nameInput.value.trim();
  playerName = (typed || 'Player').slice(0, 14);
  try { localStorage.setItem('warmWormPlayerName', playerName); } catch (e) { /* ignore */ }

  score = 0;
  lives = 3;
  resetPosition();
  enemies.forEach(e => { e.alive = true; e.dir = 1; });
  updateHud();
  startScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  hiscoreLine.textContent = '';
  hiscoreLineGameOver.textContent = '';
  gameState = 'playing';
}

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// synthesized "nom" sound — a quick descending square-wave blip plus a
// crunchy noise burst, no audio files needed
function playEatSound() {
  try {
    const ctx = ensureAudio();
    const t0 = ctx.currentTime;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(560, t0);
    osc.frequency.exponentialRampToValueAtTime(150, t0 + 0.12);
    gain.gain.setValueAtTime(0.18, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.14);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.15);

    const bufSize = Math.floor(ctx.sampleRate * 0.06);
    const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.12, t0);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.06);
    noise.connect(noiseGain).connect(ctx.destination);
    noise.start(t0);
  } catch (e) { /* audio not available — fail silently */ }
}

// synthesized "hurt" sound — a low descending sawtooth buzz for getting hit / falling
function playDeathSound() {
  try {
    const ctx = ensureAudio();
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, t0);
    osc.frequency.exponentialRampToValueAtTime(60, t0 + 0.35);
    gain.gain.setValueAtTime(0.001, t0);
    gain.gain.linearRampToValueAtTime(0.2, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.4);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.42);
  } catch (e) { /* audio not available — fail silently */ }
}

function makeEnemy(x, y) {
  return { x, y, vy: 0, dir: 1, r: ENEMY_R, alive: true, frame: 0, animT: 0 };
}

const enemies = [
  makeEnemy(6 * TILE + 16, 2 * TILE),   // lands on the platform at row 8, col 5-7
  makeEnemy(41 * TILE + 16, 2 * TILE),  // platform at row 9, col 40-44
  makeEnemy(24 * TILE + 16, 2 * TILE),  // the slope plateau
  makeEnemy(45 * TILE + 16, 2 * TILE),  // open ground
];

function updateEnemy(e) {
  if (!e.alive) return;

  e.vy += GRAVITY;
  if (e.vy > MAX_FALL) e.vy = MAX_FALL;
  e.y += e.vy;

  const row = Math.floor((e.y + e.r) / TILE);
  const col = Math.floor(e.x / TILE);
  if (e.vy >= 0 && solidAt(col, row) && e.y + e.r >= row * TILE) {
    e.y = row * TILE - e.r;
    e.vy = 0;
  }
  if (e.vy >= 0) {
    const rampY = rampSurfaceY(e.x);
    if (rampY !== null && e.y + e.r >= rampY - TILE * 0.6) {
      e.y = rampY - e.r;
      e.vy = 0;
    }
  }

  // patrol: walk until a wall or a ledge is ahead, then turn around
  const nextX = e.x + e.dir * ENEMY_SPEED;
  const aheadCol = Math.floor((nextX + e.dir * e.r) / TILE);
  const bodyRow = Math.floor(e.y / TILE);
  const footRow = Math.floor((e.y + e.r + 2) / TILE);
  const wallAhead = solidAt(aheadCol, bodyRow);
  const groundAhead = solidAt(aheadCol, footRow) || rampSurfaceY(nextX) !== null;
  if (wallAhead || !groundAhead) {
    e.dir *= -1;
  } else {
    e.x = nextX;
  }

  // walk-cycle animation, ticks while she's actually moving
  e.animT++;
  if (e.animT >= 6) {
    e.animT = 0;
    e.frame = (e.frame + 1) % ENEMY_FRAME_COUNT;
  }
}

function checkEnemyCollisions() {
  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = warm.x - e.x;
    const dy = warm.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist < R + e.r) {
      if (warm.vy > 0 && warm.y < e.y - e.r * 0.3) {
        // stomped from above
        e.alive = false;
        warm.vy = JUMP_V * 0.55;
        score++;
        updateHud();
        playEatSound();
      } else {
        loseLife();
      }
      return;
    }
  }
}

function update() {
  // gravity
  warm.vy += GRAVITY;
  if (warm.vy > MAX_FALL) warm.vy = MAX_FALL;

  // horizontal input
  warm.vx = 0;
  if (leftPressed) warm.vx = -SPEED;
  if (rightPressed) warm.vx = SPEED;

  if (jumpPressed && warm.grounded) {
    warm.vy = JUMP_V;
    warm.grounded = false;
  }

  // --- horizontal move + collide (only the head collides with tiles) ---
  warm.x += warm.vx;
  const topRow = Math.floor((warm.y - R + 2) / TILE);
  const botRow = Math.floor((warm.y + R - 2) / TILE);
  if (warm.vx > 0) {
    const col = Math.floor((warm.x + R) / TILE);
    for (let r = topRow; r <= botRow; r++) {
      if (solidAt(col, r)) { warm.x = col * TILE - R; break; }
    }
  } else if (warm.vx < 0) {
    const col = Math.floor((warm.x - R) / TILE);
    for (let r = topRow; r <= botRow; r++) {
      if (solidAt(col, r)) { warm.x = (col + 1) * TILE + R; break; }
    }
  }

  // --- vertical move + collide ---
  warm.y += warm.vy;
  warm.grounded = false;
  const leftCol = Math.floor((warm.x - R + 2) / TILE);
  const rightCol = Math.floor((warm.x + R - 2) / TILE);
  if (warm.vy > 0) {
    const row = Math.floor((warm.y + R) / TILE);
    for (let c = leftCol; c <= rightCol; c++) {
      if (solidAt(c, row)) {
        warm.y = row * TILE - R;
        warm.vy = 0;
        warm.grounded = true;
        break;
      }
    }
  } else if (warm.vy < 0) {
    const row = Math.floor((warm.y - R) / TILE);
    for (let c = leftCol; c <= rightCol; c++) {
      if (solidAt(c, row)) { warm.y = (row + 1) * TILE + R; warm.vy = 0; break; }
    }
  }

  // --- ramp support: '/' slopes are climbable even though solidAt() says
  // they're not solid. If she's falling/resting and her feet are close to
  // (or below) the ramp's sloped surface at her x, snap her onto it — this
  // is what lets her walk smoothly UP the incline. 'D' down-slopes have no
  // equivalent, so there's nothing to snap to there and she just falls.
  if (warm.vy >= 0) {
    const rampY = rampSurfaceY(warm.x);
    if (rampY !== null && warm.y + R >= rampY - TILE * 0.6) {
      warm.y = rampY - R;
      warm.vy = 0;
      warm.grounded = true;
    }
  }

  // fell off the map
  if (warm.y > canvas.height + 150) loseLife();

  enemies.forEach(updateEnemy);
  checkEnemyCollisions();

  // --- body chain ---
  segments[0].x = warm.x;
  segments[0].y = warm.y;
  segments[0].vy = 0;

  // Each other part falls under its own gravity and lands on the ground/
  // platforms/ramps independently — this is what lets the whole worm settle
  // flat on the ground when idle, instead of clumping up near the head.
  for (let i = 1; i < segments.length; i++) {
    const seg = segments[i];
    seg.vy += GRAVITY;
    if (seg.vy > MAX_FALL) seg.vy = MAX_FALL;
    seg.y += seg.vy;

    const row = Math.floor((seg.y + seg.r) / TILE);
    const col = Math.floor(seg.x / TILE);
    if (seg.vy >= 0 && solidAt(col, row) && seg.y + seg.r >= row * TILE) {
      seg.y = row * TILE - seg.r;
      seg.vy = 0;
    }
    if (seg.vy >= 0) {
      const rampY = rampSurfaceY(seg.x);
      if (rampY !== null && seg.y + seg.r >= rampY - TILE * 0.6) {
        seg.y = rampY - seg.r;
        seg.vy = 0;
      }
    }
  }

  // Distance constraint: no part may end up farther from the part before it
  // than its own radius. Parts are NOT checked against each other for
  // overlap, so the worm can curl up and pass through itself.
  for (let i = 1; i < segments.length; i++) {
    const prev = segments[i - 1];
    const cur = segments[i];
    let dx = cur.x - prev.x;
    let dy = cur.y - prev.y;
    let dist = Math.hypot(dx, dy) || 0.0001;
    const maxDist = cur.r;
    if (dist > maxDist) {
      const ratio = maxDist / dist;
      cur.x = prev.x + dx * ratio;
      cur.y = prev.y + dy * ratio;
      cur.vy = 0; // getting tugged by the chain, not falling freely right now
    }
  }

  updateCamera();
}

// ---------- Rendering ----------
function drawTiles() {
  const firstCol = Math.max(0, Math.floor(cam.x / TILE) - 1);
  const lastCol = Math.min(cols - 1, Math.ceil((cam.x + canvas.width) / TILE) + 1);

  // pass 1: side/front faces (drawn first so the top faces sit above them)
  for (let r = 0; r < rows; r++) {
    for (let c = firstCol; c <= lastCol; c++) {
      if (grid[r][c] !== '#') continue;
      const isGrass = r === 0 || grid[r - 1][c] !== '#';
      const x = c * TILE, y = r * TILE;
      const rightColor = isGrass ? '#4f8a38' : '#6a4526';
      const bottomColor = isGrass ? '#3c6d29' : '#523419';

      if (!solidAt(c + 1, r)) {
        ctx.beginPath();
        ctx.moveTo(x + TILE, y);
        ctx.lineTo(x + TILE + DEPTH, y + DEPTH);
        ctx.lineTo(x + TILE + DEPTH, y + TILE + DEPTH);
        ctx.lineTo(x + TILE, y + TILE);
        ctx.closePath();
        ctx.fillStyle = rightColor;
        ctx.fill();
      }
      if (!solidAt(c, r + 1)) {
        ctx.beginPath();
        ctx.moveTo(x, y + TILE);
        ctx.lineTo(x + DEPTH, y + TILE + DEPTH);
        ctx.lineTo(x + TILE + DEPTH, y + TILE + DEPTH);
        ctx.lineTo(x + TILE, y + TILE);
        ctx.closePath();
        ctx.fillStyle = bottomColor;
        ctx.fill();
      }
    }
  }

  // pass 2: top faces
  for (let r = 0; r < rows; r++) {
    for (let c = firstCol; c <= lastCol; c++) {
      if (grid[r][c] !== '#') continue;
      const isGrass = r === 0 || grid[r - 1][c] !== '#';
      const x = c * TILE, y = r * TILE;
      ctx.fillStyle = isGrass ? '#6fb84f' : '#8a5a35';
      ctx.fillRect(x, y, TILE, TILE);
      if (isGrass) {
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.fillRect(x, y, TILE, 5);
      }
      ctx.strokeStyle = 'rgba(0,0,0,0.08)';
      ctx.strokeRect(x, y, TILE, TILE);
    }
  }
}

// Slopes get their own simple wedge shapes rather than the boxy 3D tiles.
function drawSlopes() {
  const firstCol = Math.max(0, Math.floor(cam.x / TILE) - 1);
  const lastCol = Math.min(cols - 1, Math.ceil((cam.x + canvas.width) / TILE) + 1);
  for (let r = 0; r < rows; r++) {
    for (let c = firstCol; c <= lastCol; c++) {
      const x = c * TILE, y = r * TILE;
      if (grid[r][c] === '/') {
        // solid ramp: low on the left, high on the right (climbable)
        ctx.beginPath();
        ctx.moveTo(x, y + TILE);
        ctx.lineTo(x + TILE, y + TILE);
        ctx.lineTo(x + TILE, y);
        ctx.closePath();
        ctx.fillStyle = '#6fb84f';
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.stroke();
      } else if (grid[r][c] === 'D') {
        // decorative down-slope: NOT solid — nothing to climb down onto, so she falls
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + TILE);
        ctx.lineTo(x + TILE, y + TILE);
        ctx.closePath();
        ctx.fillStyle = '#8a5a35';
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.stroke();
      }
    }
  }
}

function drawEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    const size = e.r * 2.6; // sprite drawn a bit larger than the collision circle
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.dir < 0) ctx.scale(-1, 1); // sprite's natural facing is to the right
    ctx.drawImage(
      beetleSprite,
      e.frame * ENEMY_FRAME_SIZE, 0, ENEMY_FRAME_SIZE, ENEMY_FRAME_SIZE,
      -size / 2, -size / 2, size, size
    );
    ctx.restore();
  }
}

function drawWarm() {
  for (let i = segments.length - 1; i >= 1; i--) {
    const p = segments[i];
    const t = i / segments.length;
    const hue = 28 + t * 10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${hue}, 90%, ${62 - t * 10}%)`;
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,50,10,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // head
  const head = segments[0];
  ctx.beginPath();
  ctx.arc(head.x, head.y, head.r, 0, Math.PI * 2);
  ctx.fillStyle = '#ff8a3d';
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,50,10,0.4)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // face — flips with direction
  const dir = warm.vx < 0 ? -1 : 1;
  const ex = head.x + dir * 4;
  ctx.fillStyle = '#2b1a10';
  ctx.beginPath(); ctx.arc(ex - dir, head.y - 3, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex + dir * 4, head.y - 3, 2, 0, Math.PI * 2); ctx.fill();
}

// Drawn AFTER the worm, so these tiles overlap/cover her — the illusion of
// tunneling under or behind rock. They are purely visual: solidAt() never
// treats 'T' as solid, so movement passes straight through them.
function drawTunnels() {
  const firstCol = Math.max(0, Math.floor(cam.x / TILE) - 1);
  const lastCol = Math.min(cols - 1, Math.ceil((cam.x + canvas.width) / TILE) + 1);
  for (let r = 0; r < rows; r++) {
    for (let c = firstCol; c <= lastCol; c++) {
      if (grid[r][c] !== 'T') continue;
      const x = c * TILE, y = r * TILE;

      // right + bottom depth faces (rock is always "solid-looking" on exposed edges)
      if (grid[r][c + 1] !== 'T') {
        ctx.beginPath();
        ctx.moveTo(x + TILE, y);
        ctx.lineTo(x + TILE + DEPTH, y + DEPTH);
        ctx.lineTo(x + TILE + DEPTH, y + TILE + DEPTH);
        ctx.lineTo(x + TILE, y + TILE);
        ctx.closePath();
        ctx.fillStyle = '#332a2e';
        ctx.fill();
      }
      if (r === rows - 1 || grid[r + 1][c] !== 'T') {
        ctx.beginPath();
        ctx.moveTo(x, y + TILE);
        ctx.lineTo(x + DEPTH, y + TILE + DEPTH);
        ctx.lineTo(x + TILE + DEPTH, y + TILE + DEPTH);
        ctx.lineTo(x + TILE, y + TILE);
        ctx.closePath();
        ctx.fillStyle = '#241d20';
        ctx.fill();
      }

      // top rock face
      ctx.fillStyle = '#4f4048';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(x, y, TILE, 5);
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.strokeRect(x, y, TILE, TILE);
    }
  }
}

function loop() {
  if (gameState === 'playing') update();
  ctx.fillStyle = '#cfe8ff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(-cam.x, -cam.y);
  drawTiles();
  drawSlopes();
  drawEnemies();
  drawWarm();
  drawTunnels();
  ctx.restore();
  requestAnimationFrame(loop);
}

// ---------- Input: keyboard ----------
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = true;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') jumpPressed = true;
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = false;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') jumpPressed = false;
});

// ---------- Input: touch/mouse buttons ----------
function bindHold(el, onDown, onUp) {
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); onDown(); });
  el.addEventListener('pointerup', (e) => { e.preventDefault(); onUp(); });
  el.addEventListener('pointerleave', () => onUp());
  el.addEventListener('pointercancel', () => onUp());
}
bindHold(document.getElementById('leftBtn'), () => leftPressed = true, () => leftPressed = false);
bindHold(document.getElementById('rightBtn'), () => rightPressed = true, () => rightPressed = false);
bindHold(document.getElementById('jumpBtn'), () => jumpPressed = true, () => jumpPressed = false);

// browsers require a real user gesture before audio can play — this
// primes the AudioContext the first time she taps/presses anything
function unlockAudioOnce() {
  ensureAudio();
  window.removeEventListener('keydown', unlockAudioOnce);
  window.removeEventListener('pointerdown', unlockAudioOnce);
}
window.addEventListener('keydown', unlockAudioOnce);
window.addEventListener('pointerdown', unlockAudioOnce);

// ---------- Start / game-over screen buttons ----------
document.getElementById('playBtn').addEventListener('click', () => {
  ensureAudio();
  startGame();
});
document.getElementById('againBtn').addEventListener('click', () => {
  ensureAudio();
  startGame();
});

const MEDALS = ['🥇', '🥈', '🥉'];

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

async function showTopScores(displayEl) {
  displayEl.innerHTML = '<div class="hiscoreLoading">Loading…</div>';
  const top = await fetchTopScores();
  if (top && top.length > 0) {
    const rows = top.map((row, i) => {
      const medal = MEDALS[i] || ('#' + (i + 1));
      const name = escapeHtml(row.name || 'Player');
      return '<div class="hiscoreRow">' +
               '<span class="hiscoreRank"><span class="hiscoreMedal">' + medal + '</span>' + name + '</span>' +
               '<span class="hiscoreScore">' + row.score + '</span>' +
             '</div>';
    }).join('');
    displayEl.innerHTML =
      '<div class="hiscoreCard"><div class="hiscoreTitle">🏆 Global Top 5</div>' + rows + '</div>';
  } else {
    displayEl.innerHTML =
      '<div class="hiscoreCard"><div class="hiscoreTitle">🏆 High Score</div>' +
      '<div class="hiscoreFallback">Best on this device: ' + getHighScore() + '</div></div>';
  }
}
document.getElementById('hiscoreBtn').addEventListener('click', () => showTopScores(hiscoreLine));
document.getElementById('hiscoreBtnGameOver').addEventListener('click', () => showTopScores(hiscoreLineGameOver));

loop();
</script>
