<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Space Invaders</title>
    <link rel="stylesheet" href="lib/fonts.css" />
    <script src="lib/phaser-3.55.2.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #game {
            /*  Phaser measures this box and fits the canvas inside it, so it has to
                take whatever height the debug bar leaves over. */
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
        }
        #game canvas {
            /*  Inline canvases sit on the text baseline, which leaves a few pixels
                of slack underneath them.  The frame is an outline rather than a
                border so it never feeds back into the size Phaser measures. */
            display: block;
            background-color: #111;
            outline: 2px solid #555;
            border-radius: 8px;
            /*  Keeps the browser from stealing drags for scrolling and pinch-zoom. */
            touch-action: none;
        }
        #debug-bar {
            /*  Development tools: hidden unless the page is opened with
                ?debug=true, which adds the class below to the body. */
            display: none;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 10px 0 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 500;
            color: #88ddff;
        }
        body.debug #debug-bar {
            display: flex;
        }
        #debug-bar button {
            height: 30px;
            min-width: 38px;
            padding: 0 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #88ddff;
            background: #111;
            border: 2px solid #88ddff;
            border-radius: 6px;
            cursor: pointer;
        }
        #drop-gifts {
            font-size: 15px !important;
        }
        #toggle-sound {
            font-size: 15px !important;
            min-width: 76px;
        }
        #debug-bar button:hover {
            background: #163041;
        }
        #level-label {
            min-width: 76px;
            text-align: center;
        }
        @media (max-width: 640px) {
            #debug-bar {
                gap: 8px;
                margin: 6px 0;
                font-size: 12px;
            }
            #debug-bar button {
                height: 26px;
                font-size: 16px;
            }
            #debug-hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <div id="debug-bar">
        <button id="level-down" type="button" tabindex="-1">&minus;</button>
        <span id="level-label">Level 1</span>
        <button id="level-up" type="button" tabindex="-1">+</button>
        <button id="drop-gifts" type="button" tabindex="-1">drop all gifts</button>
        <button id="toggle-sound" type="button" tabindex="-1">sound on</button>
        <span id="debug-hint">debug: jump levels (or press + / -), G drops every gift, M mutes</span>
    </div>
    <script>
        //  ---- design resolution --------------------------------------------
        //  The board is always the same 800 x 600 playfield, on every device: the
        //  scale manager only shrinks the canvas to fit the screen, so nobody gets
        //  a wider view or a longer run-up than anybody else.  Every coordinate in
        //  the scene is derived from these two numbers.
        const DESIGN = { width: 800, height: 600 };

        //  ---- lettering ------------------------------------------------------
        //  Two faces from Google Fonts, vendored into lib/fonts.css: 'Jaro' is
        //  the chunky display face used for anything that shouts, and 'Outfit'
        //  is the quiet sans used for the lines that explain things.  Both run
        //  a little narrower than the old monospace, so the sizes asked for by
        //  the rest of the code are nudged up to fill the same space.
        const FONT_DISPLAY = '"Jaro", sans-serif';
        const FONT_BODY = '"Outfit", sans-serif';
        const FONT_SCALE = { display: 1.25, body: 1.2 };
        const displaySize = (size) => Math.round(size * FONT_SCALE.display);
        const bodySize = (size) => Math.round(size * FONT_SCALE.body);

        //  ---- debug mode ---------------------------------------------------
        //  The level stepper, the gift dropper and the on-screen readout are
        //  development tools rather than part of the game, so they only exist
        //  when the page is opened with ?debug=true.
        const DEBUG = new URLSearchParams(window.location.search).get('debug') === 'true';
        if (DEBUG) {
            document.body.classList.add('debug');
        }

        //  ---- saved data ----------------------------------------------------
        //  The scoreboard and the sound settings live in the browser's local
        //  storage so they survive a reload.  A page opened straight off disk is
        //  not always allowed to use it, so everything falls back to memory and
        //  the game carries on regardless.
        const STORE = {
            memory: {},
            read: function (key, fallback) {
                try {
                    const raw = window.localStorage.getItem(key);
                    if (raw !== null) {
                        return JSON.parse(raw);
                    }
                } catch (error) {
                    //  Blocked or full: fall through to whatever is in memory.
                }
                return (key in this.memory) ? this.memory[key] : fallback;
            },
            write: function (key, value) {
                this.memory[key] = value;
                try {
                    window.localStorage.setItem(key, JSON.stringify(value));
                } catch (error) {
                    //  Private mode or a blocked file:// origin: memory it is.
                }
            }
        };

        //  ---- scoreboard ----------------------------------------------------
        const HIGH_SCORES = {
            key: 'spaceInvaders.highScores',
            size: 10,
            //  Where the score from the last game landed, so the board can point
            //  it out when the menu shows up again.
            recent: 0,
            list: function () {
                const saved = STORE.read(this.key, []);
                if (!Array.isArray(saved)) {
                    return [];
                }
                return saved.filter(entry => entry && typeof entry.score === 'number');
            },
            best: function () {
                const all = this.list();
                return all.length > 0 ? all[0].score : 0;
            },
            submit: function (score, level) {
                this.recent = 0;
                if (!score || score <= 0) {
                    return 0;
                }
                const entry = {
                    score: score,
                    level: level || 1,
                    date: new Date().toISOString().slice(0, 10)
                };
                const all = this.list();
                all.push(entry);
                //  A tie keeps the older score ahead: sort is stable, and the new
                //  entry went in last.
                all.sort((a, b) => b.score - a.score);
                const board = all.slice(0, this.size);
                STORE.write(this.key, board);
                this.recent = board.indexOf(entry) + 1;
                return this.recent;
            },
            clear: function () {
                this.recent = 0;
                STORE.write(this.key, []);
            }
        };

        //  ---- settings ------------------------------------------------------
        const DEFAULT_VOLUME = 0.5;
        const SETTINGS = {
            key: 'spaceInvaders.settings',
            values: null,
            get: function (name, fallback) {
                if (!this.values) {
                    const saved = STORE.read(this.key, {});
                    this.values = (saved && typeof saved === 'object') ? saved : {};
                }
                return (name in this.values) ? this.values[name] : fallback;
            },
            set: function (name, value) {
                this.get(name);
                this.values[name] = value;
                STORE.write(this.key, this.values);
            },
            //  Both scenes start by matching the sound system to what was chosen
            //  last time, before anything has a chance to make a noise.
            applyTo: function (scene) {
                scene.sound.mute = this.get('muted', false);
                scene.sound.volume = this.get('volume', DEFAULT_VOLUME);
            }
        };

        //  ---- artwork -------------------------------------------------------
        //  Every sprite is generated by generate_assets.py.  Both scenes ask for
        //  the same set and anything already in the texture cache is skipped, so
        //  the menu paying for the artwork means the game starts instantly.
        const ART = {
            images: {
                background: 'background.png',
                stars_near: 'stars_near.png',
                player: 'player.png',
                bullet_player: 'bullet_player.png',
                bullet_invader: 'bullet_invader.png',
                bonus_ship: 'bonus_ship.png',
                shield_block: 'shield_block.png',
                laser_beam: 'laser_beam.png',
                force_field: 'force_field.png',
                powerup_glow: 'powerup_glow.png'
            },
            sheets: {
                invader_a: { file: 'invader_a_sheet.png', size: 80 },
                invader_b: { file: 'invader_b_sheet.png', size: 80 },
                invader_c: { file: 'invader_c_sheet.png', size: 80 },
                invader_d: { file: 'invader_d_sheet.png', size: 80 },
                explosion: { file: 'explosion_sheet.png', size: 80 },
                powerup: { file: 'powerup_sheet.png', size: 48 }
            },
            load: function (scene) {
                Object.keys(this.images).forEach(key => {
                    if (!scene.textures.exists(key)) {
                        scene.load.image(key, 'assets/' + this.images[key]);
                    }
                });
                Object.keys(this.sheets).forEach(key => {
                    if (scene.textures.exists(key)) {
                        return;
                    }
                    const sheet = this.sheets[key];
                    scene.load.spritesheet(key, 'assets/' + sheet.file, {
                        frameWidth: sheet.size,
                        frameHeight: sheet.size
                    });
                });
            }
        };

        //  ---- sound ---------------------------------------------------------
        //  Every effect is generated by generate_sounds.py.  The number is how
        //  many copies may overlap: only <audio> playback needs them, and each
        //  copy is one more element to fetch, so they are kept to the few effects
        //  that really stack up.
        const SFX = {
            effects: {
                sfx_shoot: 3,
                sfx_laser: 1,
                sfx_invader_die: 3,
                sfx_armour_hit: 2,
                sfx_shield_hit: 2,
                sfx_player_hit: 1,
                sfx_nuke: 1,
                sfx_powerup: 1,
                sfx_extra_life: 1,
                sfx_force_field: 1,
                sfx_spark: 2,
                sfx_scramble: 1,
                sfx_push: 1,
                sfx_saucer: 1,
                sfx_saucer_die: 1,
                sfx_dive: 1,
                sfx_wave_clear: 1,
                sfx_level_start: 1,
                sfx_game_over: 1,
                sfx_march_0: 1,
                sfx_march_1: 1,
                sfx_march_2: 1,
                sfx_march_3: 1
            },
            //  Sounds are fetched once the scene is already up rather than in
            //  preload: reading dozens of <audio> elements off a filesystem is
            //  slow and occasionally stalls, and nobody should stare at a blank
            //  screen over a sound effect.  The menu usually gets them all in
            //  while the player is reading it; whatever is still missing is asked
            //  for again when the game starts.  Browsers drop a media request now
            //  and then when a pile of them is in flight, so they go out a handful
            //  at a time and anything that fell over is retried.
            load: function (scene) {
                let passes = 0;
                const pass = () => {
                    const missing = Object.keys(this.effects).filter(
                        key => !scene.cache.audio.exists(key)
                    );
                    //  A scene that has been left behind stops asking: whichever
                    //  scene comes next picks up where this one left off.
                    const finished = scene.sys.settings.status >= Phaser.Scenes.SHUTDOWN;
                    if (missing.length === 0 || passes >= 5 || finished) {
                        return;
                    }
                    passes++;
                    missing.forEach(key => {
                        scene.load.audio(key, 'assets/' + key + '.wav', {
                            instances: this.effects[key]
                        });
                    });
                    scene.load.once('complete', () => scene.time.delayedCall(250, pass));
                    scene.load.start();
                };
                scene.load.maxParallelDownloads = 4;
                pass();
            },
            //  One entry point for every effect, so a missing or blocked audio
            //  file can never take a scene down with it.
            play: function (scene, key, volume) {
                if (!scene.cache.audio.exists(key)) {
                    return;
                }
                scene.sound.play(key, { volume: (volume === undefined) ? 1 : volume });
            }
        };

        //  ---- the sky -------------------------------------------------------
        //  The starfield tiles seamlessly, so it can drift for ever. Two copies
        //  of it scroll at different speeds and sizes, which reads as depth, and
        //  every so often a meteor crosses the board. All of it creeps along at
        //  a few pixels a second: enough to feel alive, slow enough that it
        //  never pulls the eye away from the invaders.
        const SKY = {
            speed: 0.012,
            nearSpeed: 0.034,
            nearAlpha: 0.75,
            meteorMin: 5000,
            meteorMax: 13000,

            add: function (scene, width, height) {
                //  The sky is 4:3 artwork, so it is scaled to cover the board and
                //  cropped rather than stretched: stars stay square in portrait.
                const scale = Math.max(width / 1600, height / 1200);

                const far = scene.add.tileSprite(0, 0, width, height, 'background');
                far.setOrigin(0);
                far.setTileScale(scale);
                far.setDepth(-10);

                //  The near layer is a sparse sheet of bigger stars, scrolled
                //  faster than the sky behind it and added rather than painted
                //  over so it glows instead of flattening the art.
                const near = scene.add.tileSprite(0, 0, width, height, 'stars_near');
                near.setOrigin(0);
                near.setTileScale(scale);
                near.setAlpha(SKY.nearAlpha);
                near.setBlendMode(Phaser.BlendModes.ADD);
                near.setDepth(-9);

                scene.sky = far;
                scene.skyNear = near;
                scene.skyMeteors = [];
                scene.nextMeteor = scene.time.now +
                    Phaser.Math.Between(SKY.meteorMin, SKY.meteorMax);
                return far;
            },

            meteor: function (scene) {
                const W = scene.scale.width;
                const H = scene.scale.height;
                //  Meteors always fall the same way as the stars, just far faster,
                //  and they stay in the upper half so they never sit behind the
                //  invaders at the moment they are brightest.
                const speed = Phaser.Math.Between(340, 520);
                const rightwards = Phaser.Math.Between(0, 1) === 1;
                const vx = speed * (rightwards ? 0.85 : -0.85);
                const vy = speed * 0.62;
                const streak = scene.add.rectangle(
                    rightwards ? Phaser.Math.Between(-80, W * 0.4)
                               : Phaser.Math.Between(W * 0.6, W + 80),
                    Phaser.Math.Between(-30, H * 0.35),
                    2,
                    Phaser.Math.Between(34, 70),
                    0xffffff
                );
                streak.setOrigin(0.5, 1);
                streak.setAngle(Phaser.Math.RadToDeg(Math.atan2(-vx, vy)));
                streak.setAlpha(0);
                streak.setBlendMode(Phaser.BlendModes.ADD);
                streak.setDepth(-9);
                streak.vx = vx;
                streak.vy = vy;
                streak.life = 0;
                streak.span = Phaser.Math.Between(900, 1400);
                scene.skyMeteors.push(streak);
            },

            drift: function (scene, delta) {
                if (!scene.sky) {
                    return;
                }
                scene.sky.tilePositionY -= delta * SKY.speed;
                scene.skyNear.tilePositionY -= delta * SKY.nearSpeed;

                if (scene.time.now >= scene.nextMeteor) {
                    scene.nextMeteor = scene.time.now +
                        Phaser.Math.Between(SKY.meteorMin, SKY.meteorMax);
                    SKY.meteor(scene);
                }

                //  Meteors are moved by hand rather than tweened: the menu clears
                //  its tweens whenever a page changes, which would strand them.
                const step = delta / 1000;
                scene.skyMeteors = scene.skyMeteors.filter(streak => {
                    streak.life += delta;
                    const t = streak.life / streak.span;
                    if (t >= 1) {
                        streak.destroy();
                        return false;
                    }
                    streak.x += streak.vx * step;
                    streak.y += streak.vy * step;
                    //  Flare up quickly, then burn out over the rest of the run.
                    streak.setAlpha(t < 0.2 ? t * 4.25 : (1 - t) * 1.06);
                    return true;
                });
            }
        };

        //  ---- the gift catalogue --------------------------------------------
        //  One source of truth: the game reads the drop table from here and the
        //  help page reads the descriptions. The order matches the frames in
        //  powerup_sheet.png.
        const POWERUPS = [
            {
                type: 'rapid', name: 'RAPID FIRE', colour: '#ffbe28', tint: 0xffbe28, weight: 6,
                blurb: 'the cannon cycles twice as fast',
                detail: 'lasts 8 seconds'
            },
            {
                type: 'multi', name: 'TRIPLE SHOT', colour: '#ff7828', tint: 0xff7828, weight: 6,
                blurb: 'fires a three-bullet fan instead of one',
                detail: 'lasts 10 seconds'
            },
            {
                type: 'laser', name: 'LASER', colour: '#ff3c3c', tint: 0xff3c3c, weight: 4,
                blurb: 'burns a beam straight up the screen',
                detail: 'everything in the column goes at once'
            },
            {
                type: 'life', name: 'EXTRA LIFE', colour: '#3ce66e', tint: 0x3ce66e, weight: 3,
                blurb: 'one more ship in reserve',
                detail: 'five is as many as you can hold'
            },
            {
                type: 'twin', name: 'TWIN SHIP', colour: '#46c8ff', tint: 0x46c8ff, weight: 3,
                blurb: 'a wingman flies at your side and fires with you',
                detail: 'it picks up gifts too  -  lasts 12 seconds'
            },
            {
                type: 'push', name: 'PUSH BACK', colour: '#b478ff', tint: 0xaa78ff, weight: 3,
                blurb: 'shoves the swarm back to its starting row',
                detail: 'any dive already in progress is called off'
            },
            {
                type: 'nuke', name: 'MEGA BOMB', colour: '#ff46be', tint: 0xff46be, weight: 1,
                blurb: 'every invader on the board goes up at once',
                detail: 'the rarest gift in the game'
            },
            {
                type: 'shield', name: 'FORCE FIELD', colour: '#c8d7eb', tint: 0xc8d7eb, weight: 4,
                blurb: 'a bubble that burns whatever touches it',
                detail: 'lasts 7 seconds'
            },
            {
                type: 'scramble', name: 'SCRAMBLE', colour: '#3cdcbe', tint: 0x3cdcbe, weight: 4,
                blurb: 'the survivors close ranks and swap places',
                detail: 'the gaps you shot in the formation vanish'
            }
        ];

        //  ---- the menu ------------------------------------------------------
        //  Start page, scoreboard, options and credits, all drawn on the same
        //  800 x 600 board as the game so every device sees the same layout.
        const MENU_IDLE = '#8cffcd';
        const MENU_ACTIVE = '#ffffff';

        const MENU_SCENE = {
            key: 'Menu',

            preload: function () {
                ART.load(this);
            },

            create: function () {
                const W = this.scale.width;
                const H = this.scale.height;

                SETTINGS.applyTo(this);
                SFX.load(this);

                SKY.add(this, W, H);

                this.page = this.add.container(0, 0);
                this.pageName = 'main';
                this.buttons = [];
                this.selected = 0;
                this.wheelReadyAt = 0;

                //  ---- page furniture ------------------------------------------
                //  Headings and buttons get the display face; anything passed as
                //  'normal' is body copy and gets the quieter sans instead.
                this.label = function (text, y, size, colour, weight) {
                    const quiet = (weight === 'normal');
                    const px = quiet ? bodySize(size) : displaySize(size);
                    const item = this.add.text(W / 2, y, text, {
                        fontFamily: quiet ? FONT_BODY : FONT_DISPLAY,
                        fontSize: px + 'px',
                        fill: colour,
                        //  Jaro comes in one weight only, so the outline does the
                        //  work a bold cut would have done.
                        fontStyle: quiet ? '500' : 'normal',
                        stroke: '#000000',
                        //  A heavy outline would close up the smaller body text.
                        strokeThickness: quiet ? 2 : Math.max(3, Math.round(px / 8)),
                        align: 'center'
                    });
                    item.setOrigin(0.5);
                    this.page.add(item);
                    return item;
                };

                this.button = function (text, y, action) {
                    const item = this.label(text, y, 26, MENU_IDLE);
                    //  Just enough padding to click comfortably without the
                    //  hit boxes of neighbouring buttons touching.
                    item.setPadding(18, 4, 18, 4);
                    item.action = action;
                    item.setInteractive({ useHandCursor: true });
                    item.on('pointerover', () => this.select(this.buttons.indexOf(item)));
                    item.on('pointerdown', () => {
                        this.select(this.buttons.indexOf(item));
                        this.activate();
                    });
                    this.buttons.push(item);
                    return item;
                };

                this.select = function (index) {
                    if (this.buttons.length === 0) {
                        return;
                    }
                    this.selected = Phaser.Math.Wrap(index, 0, this.buttons.length);
                    this.buttons.forEach((button, i) => {
                        const active = (i === this.selected);
                        button.setColor(active ? MENU_ACTIVE : MENU_IDLE);
                        button.setScale(active ? 1.08 : 1);
                    });
                };

                this.activate = function () {
                    const button = this.buttons[this.selected];
                    if (button) {
                        SFX.play(this, 'sfx_powerup', 0.5);
                        button.action();
                    }
                };

                this.show = function (name) {
                    //  The decorations tween, so they are stopped before the page
                    //  they belong to is torn down.
                    this.tweens.killAll();
                    this.page.destroy();
                    this.page = this.add.container(0, 0);
                    this.buttons = [];
                    this.selected = 0;
                    //  Only pages that browse a list hook this up.
                    this.pageStep = null;
                    this.pageName = name;
                    PAGES[name].call(this, W, H);
                    this.select(0);
                };

                //  ---- the pages -----------------------------------------------
                const PAGES = {
                    main: function (W, H) {
                        this.label('SPACE INVADERS', 92, 52, '#00ff00');
                        this.label('hold the line', 134, 16, MENU_IDLE, 'normal');

                        //  A row of the enemy, purely for the look of the thing.
                        ['invader_a', 'invader_b', 'invader_c'].forEach((key, i) => {
                            const sprite = this.add.sprite(W / 2 + (i - 1) * 84, 196, key, 0);
                            sprite.setDisplaySize(46, 46);
                            this.page.add(sprite);
                            this.tweens.add({
                                targets: sprite,
                                y: 186,
                                duration: 760,
                                delay: i * 130,
                                yoyo: true,
                                repeat: -1,
                                ease: 'Sine.easeInOut'
                            });
                        });

                        const best = HIGH_SCORES.best();
                        this.label(best > 0 ? 'BEST   ' + best : 'nothing on the board yet',
                                   250, 18, '#ffdd55');

                        this.button('PLAY', 300, () => this.scene.start('Game'));
                        this.button('HIGH SCORES', 348, () => this.show('scores'));
                        this.button('POWER-UPS', 396, () => this.show('powerups'));
                        this.button('OPTIONS', 444, () => this.show('options'));
                        this.button('CREDITS', 492, () => this.show('credits'));

                        this.label('arrows or drag to move     space or hold to fire',
                                   548, 15, '#88ddff', 'normal');
                    },

                    scores: function (W, H) {
                        this.label('HIGH SCORES', 76, 38, '#ffdd55');

                        const board = HIGH_SCORES.list();
                        if (board.length === 0) {
                            this.label('the board is empty', 230, 26, MENU_IDLE);
                            this.label('play a round and put something on it',
                                       268, 16, '#ffffff', 'normal');
                        } else {
                            board.forEach((entry, i) => {
                                const row = String(i + 1).padStart(2, ' ') + '.  ' +
                                    String(entry.score).padStart(7, ' ') + '   level ' +
                                    String(entry.level || 1).padStart(2, ' ') + '   ' +
                                    (entry.date || '');
                                //  The score from the last game is called out in green.
                                let colour = '#ffffff';
                                if (HIGH_SCORES.recent === i + 1) {
                                    colour = '#00ff00';
                                } else if (i === 0) {
                                    colour = '#ffdd55';
                                }
                                this.label(row, 142 + i * 34, 19, colour, 'normal');
                            });
                        }

                        this.button('BACK', 542, () => this.show('main'));
                    },

                    powerups: function (W, H) {
                        this.label('POWER-UPS', 58, 34, '#ffdd55');
                        this.label('every gift the invaders leave behind', 92, 15,
                                   '#88ddff', 'normal');

                        const total = POWERUPS.reduce((sum, gift) => sum + gift.weight, 0);
                        const centreY = 176;

                        const glow = this.add.sprite(W / 2, centreY, 'powerup_glow');
                        glow.setDisplaySize(132, 132);

                        const name = this.label('', 256, 30, '#ffffff');

                        const dots = POWERUPS.map((gift, i) => {

                        this.tweens.add({
                            targets: glow,

                            repeat: -1
                        });
                        this.tweens.add({
                            targets: capsule,
                            y: centreY - 8,
                            duration: 900,
                            yoyo: true,
                            repeat: -1,
                            ease: 'Sine.easeInOut'
                        });

                        this.button('NEXT GIFT', 488, () => this.pageStep(1));
                        this.button('BACK', 538, () => this.show('main'));
                    },

                    options: function (W, H) {
                        this.label('OPTIONS', 76, 38, MENU_IDLE);

                        const soundButton = this.button('', 182, () => {
                            this.sound.mute = !this.sound.mute;
                            SETTINGS.set('muted', this.sound.mute);
                            paint();
                        });

                        const volumeButton = this.button('', 242, () => {
                            const steps = [0.25, 0.5, 0.75, 1];
                            let nearest = 0;
                            steps.forEach((step, i) => {
                                if (Math.abs(step - this.sound.volume) <
                                    Math.abs(steps[nearest] - this.sound.volume)) {
                                    nearest = i;
                                }
                            });
                            this.sound.volume = steps[(nearest + 1) % steps.length];
                            SETTINGS.set('volume', this.sound.volume);
                            paint();
                            SFX.play(this, 'sfx_shoot', 0.8);
                        });

                        const clearButton = this.button('CLEAR HIGH SCORES', 302, () => {
                            HIGH_SCORES.clear();

                        });

                        const paint = () => {
                            soundButton.setText('SOUND    ' + (this.sound.mute ? 'OFF' : 'ON'));
                            volumeButton.setText('VOLUME   ' + Math.round(this.sound.volume * 100) + '%');
                        };
                        paint();

                        this.label('M mutes at any time', 372, 15, '#88ddff', 'normal');

                        this.button('BACK', 470, () => this.show('main'));
                    },

                    credits: function (W, H) {
                        this.label('CREDITS', 68, 38, '#ffdd55');

                        this.label('OFER SHOR', 126, 30, '#ffdd55');
                        this.label('had the idea and made it happen', 156, 16, '#ffffff', 'normal');

                        this.label('GITHUB COPILOT', 212, 24, MENU_IDLE);
                        this.label('with Claude Opus 5  -  wrote the game', 240, 16, '#ffffff', 'normal');

                        this.label('generate_assets.py', 294, 22, '#88ddff');
                        this.label('python + pillow  -  draws every sprite', 320, 16, '#ffffff', 'normal');

                        this.label('generate_sounds.py', 372, 22, '#88ddff');
                        this.label('python  -  synthesises every sound from scratch', 398, 16, '#ffffff', 'normal');

                        this.label('built with Phaser 3', 452, 16, MENU_IDLE, 'normal');

                        this.button('BACK', 528, () => this.show('main'));
                    }
                };

                //  ---- keyboard ------------------------------------------------
                this.input.keyboard.on('keydown-UP', () => this.select(this.selected - 1));
                this.input.keyboard.on('keydown-DOWN', () => this.select(this.selected + 1));
                this.input.keyboard.on('keydown-ENTER', () => this.activate());
                this.input.keyboard.on('keydown-SPACE', () => this.activate());
                //  Left and right, plus the wheel, browse pages that hold a list.
                this.input.keyboard.on('keydown-LEFT', () => {
                    if (this.pageStep) {
                        this.pageStep(-1);
                    }
                });
                this.input.keyboard.on('keydown-RIGHT', () => {
                    if (this.pageStep) {
                        this.pageStep(1);
                    }
                });
                this.input.on('wheel', (pointer, objects, deltaX, deltaY) => {
                    //  One flick of the wheel should move one step, not ten.
                    if (!this.pageStep || deltaY === 0 || this.time.now < this.wheelReadyAt) {
                        return;
                    }
                    this.wheelReadyAt = this.time.now + 160;
                    this.pageStep(deltaY > 0 ? 1 : -1);
                });
                this.input.keyboard.on('keydown-ESC', () => {
                    if (this.pageName !== 'main') {
                        this.show('main');
                    }
                });
                this.input.keyboard.on('keydown-M', () => {
                    this.sound.mute = !this.sound.mute;
                    SETTINGS.set('muted', this.sound.mute);
                    if (this.pageName === 'options') {
                        this.show('options');
                    }
                });

                this.show('main');
            },

            update: function (time, delta) {
                SKY.drift(this, delta);
            }
        };

        const config = {
            type: Phaser.AUTO,
            backgroundColor: '#000',
            pixelArt: true,
            scale: {
                parent: 'game',
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                //  Phaser would otherwise force 100% height onto the parent and
                //  fight the flex layout above.
                expandParent: false,
                width: DESIGN.width,
                height: DESIGN.height,
                //  Never blow the board up past 1:1 on a big desktop window.
                max: { width: DESIGN.width, height: DESIGN.height }
            },
            loader: {
                //  <img> loading works from the file:// protocol, unlike XHR.
                imageLoadType: 'HTMLImageElement'
            },
            audio: {
                //  Web Audio decodes samples fetched over XHR, which a file:// page
                //  is not allowed to do, so plain <audio> elements are used instead
                //  when the game is opened straight off disk.
                disableWebAudio: window.location.protocol === 'file:'
            },
            physics: {
                default: 'arcade',
                arcade: {
                    debug: false
                }
            },
            scene: [MENU_SCENE, {
                key: 'Game',
                preload: function () {
                    ART.load(this);
                },
                create: function () {
                    if (typeof this.physics === 'undefined' && typeof this.sys !== 'undefined' && typeof this.sys.game !== 'undefined') {
                        this.physics = this.sys.game.physics;
                    }

                    //  ---- board layout --------------------------------------
                    //  The playfield is the same on every device, so these are the
                    //  classic 800 x 600 positions; they are written in terms of the
                    //  design size so the whole board stays consistent if it is ever
                    //  retuned in one place.
                    const W = this.scale.width;
                    const H = this.scale.height;
                    this.viewW = W;
                    this.viewH = H;

                    this.gridStep = 50;                  // invader (40) + padding (10)
                    this.gridRows = 5;
                    this.gridCols = Phaser.Math.Clamp(
                        Math.floor((W - 140) / this.gridStep) + 1, 5, 10
                    );
                    this.gridLeft = Math.round((W - (this.gridCols - 1) * this.gridStep) / 2);
                    this.gridTop = Math.max(110, Math.round(H * 0.2));

                    this.marchLeft = 50;                 // bounding-box limits for the swarm
                    this.marchRight = W - 50;
                    this.playerY = H - 50;
                    this.bunkerTop = this.playerY - 95;
                    //  The saucer flies through the empty sky above the swarm.
                    this.bonusY = Math.max(70, this.gridTop - 60);

                    //  Kept at 1 for the 800 x 600 board: they exist so the marching
                    //  speeds stay tied to the board size rather than to bare numbers.
                    this.speedX = W / 800;
                    this.speedY = H / 600;
                    this.dropScale = Phaser.Math.Clamp(H / 600, 1, 1.5);

                    //  ---- sound ---------------------------------------------
                    SETTINGS.applyTo(this);
                    this.saucerSound = null;

                    this.playSfx = function (key, volume) {
                        SFX.play(this, key, volume);
                    };

                    this.startSaucerSound = function () {
                        if (this.saucerSound || !this.cache.audio.exists('sfx_saucer')) {
                            return;
                        }
                        this.saucerSound = this.sound.add('sfx_saucer', { loop: true, volume: 0.3 });
                        this.saucerSound.play();
                    };

                    this.stopSaucerSound = function () {
                        if (!this.saucerSound) {
                            return;
                        }
                        this.saucerSound.stop();
                        this.saucerSound.destroy();
                        this.saucerSound = null;
                    };

                    //  The menu normally has these in hand already; this tops up
                    //  anything that did not make it.
                    SFX.load(this);

                    this.quitToMenu = function () {
                        //  The countdown and the player can both ask for the menu,
                        //  so only the first request through here does anything.
                        if (this.leavingToMenu) {
                            return;
                        }
                        this.leavingToMenu = true;

                        //  Bailing out mid-run still counts, but a finished game has
                        //  already been put on the board by gameOver().
                        if (!this.isGameOver) {
                            HIGH_SCORES.submit(this.score, this.level);
                        }
                        this.stopSaucerSound();
                        this.scene.start('Menu');
                    };

                    this.fireInvaderBullet = function () {
                        const aliveInvaders = this.invaders.getChildren().filter(
                            invader => invader.active && !invader.isDoomed
                        );
                        if (aliveInvaders.length === 0) {
                            return;
                        }

                        const randomInvader = Phaser.Utils.Array.GetRandom(aliveInvaders);
                        const bullet = this.add.sprite(randomInvader.x, randomInvader.y + 20, 'bullet_invader');
                        bullet.setDisplaySize(10, 24);
                        this.physics.add.existing(bullet);
                        this.invaderBullets.add(bullet);
                        //  The bolt is drawn big so it is easy to read, but it still
                        //  hits with the old, slimmer hitbox.
                        bullet.body.setSize(4 / bullet.scaleX, 12 / bullet.scaleY);
                        bullet.body.setVelocityY(this.invaderBulletSpeed);
                        bullet.body.setAllowGravity(false);
                    };

                    this.paintInvader = function (invader) {
                        //  Armour plating is colour coded: orange while it still needs
                        //  two hits, plain cyan once it is down to its last one.
                        if (invader.hp > 1) {
                            invader.setTint(this.ARMOUR_TINT);
                        } else {
                            invader.clearTint();
                        }
                    };

                    this.hitInvader = function (bullet, invader) {
                        const x = invader.x;
                        const y = invader.y;

                        bullet.destroy();

                        if (invader.hp > 1 && !invader.isDoomed) {
                            //  Armour soaks the shot: flash, then show the new colour.
                            invader.hp -= 1;
                            this.score += 5;
                            this.scoreText.setText('Score: ' + this.score);
                            this.playSfx('sfx_armour_hit', 0.6);

                            invader.setTint(0xffffff);
                            this.time.delayedCall(90, () => {
                                if (invader.active && !invader.isDoomed) {
                                    this.paintInvader(invader);
                                }
                            });

                            const spark = this.add.sprite(x, y, 'explosion');
                            spark.setDisplaySize(26, 26);
                            spark.setDepth(5);
                            spark.play('explode');
                            spark.once('animationcomplete', () => spark.destroy());
                            return;
                        }

                        const points = invader.points || 10 * (invader.maxHp || 1);
                        invader.destroy();
                        this.score += points;
                        this.scoreText.setText('Score: ' + this.score);
                        this.playSfx('sfx_invader_die', 0.5);

                        //  Roughly one in eight kills leaves a capsule behind.
                        if (Phaser.Math.Between(1, 8) === 1) {
                            this.dropPowerUp(x, y);
                        }

                        const boom = this.add.sprite(x, y, 'explosion');
                        boom.setDisplaySize(52, 52);
                        boom.setDepth(5);
                        boom.play('explode');
                        boom.once('animationcomplete', () => boom.destroy());
                    };

                    this.spawnShields = function () {
                        //  Classic bunker outline: X = block, . = gap.
                        const shape = [
                            '..XXXX..',
                            '.XXXXXX.',
                            'XXXXXXXX',
                            'XXXXXXXX',
                            'XXX..XXX',
                            'XX....XX'
                        ];
                        const blockSize = 10;
                        //  Cover thins out every two levels, and from level 4 each
                        //  block crumbles in a single hit instead of two.  The bunker
                        //  centres are fractions of the board width so they spread
                        //  correctly on a narrow phone board too.
                        const layouts = {
                            4: [0.1625, 0.3875, 0.6125, 0.8375],
                            3: [0.225, 0.5, 0.775],
                            2: [0.325, 0.675],
                            1: [0.5]
                        };
                        const centres = layouts[this.shieldCount].map(f => Math.round(f * this.viewW));
                        const topY = this.bunkerTop;

                        this.shields.clear(true, true);

                        centres.forEach(centreX => {
                            const originX = centreX - (shape[0].length * blockSize) / 2 + blockSize / 2;
                            for (let row = 0; row < shape.length; row++) {
                                for (let col = 0; col < shape[row].length; col++) {
                                    if (shape[row][col] !== 'X') continue;

                                    const block = this.add.sprite(
                                        originX + col * blockSize,
                                        topY + row * blockSize,
                                        'shield_block'
                                    );
                                    block.setDisplaySize(blockSize, blockSize);
                                    block.setTint(this.shieldBlockHp > 1 ? 0x00ff88 : 0xffaa00);
                                    block.setDepth(4);
                                    block.hp = this.shieldBlockHp;
                                    this.physics.add.existing(block);
                                    this.shields.add(block);
                                    block.body.setAllowGravity(false);
                                    block.body.setImmovable(true);
                                }
                            }
                        });
                    };

                    this.hitShield = function (objA, objB) {
                        //  Either argument may be the block, depending on collision order.
                        const block = this.shields.contains(objA) ? objA : objB;
                        const bullet = (block === objA) ? objB : objA;

                        if (!block || !block.active || !bullet || !bullet.active) {
                            return;
                        }

                        bullet.destroy();
                        block.hp -= 1;
                        this.playSfx('sfx_shield_hit', 0.35);

                        if (block.hp <= 0) {
                            block.destroy();
                        } else {
                            //  Scorched block: green turns amber before it crumbles.
                            block.setTint(0xffaa00);
                        }
                    };

                    this.crushShield = function (objA, objB) {
                        //  Invaders erase any bunker they march into.
                        const block = this.shields.contains(objA) ? objA : objB;
                        if (block && block.active) {
                            block.destroy();
                        }
                    };

                    this.launchDiver = function () {
                        const candidates = this.invaders.getChildren().filter(
                            invader => invader.active && !invader.isDiving && !invader.isDoomed
                        );
                        if (candidates.length === 0) {
                            return;
                        }

                        const diver = Phaser.Utils.Array.GetRandom(candidates);
                        diver.isDiving = true;
                        diver.setDepth(7);
                        this.playSfx('sfx_dive', 0.45);
                        this.physics.moveTo(diver, this.player.x, this.player.y, this.diveSpeed);
                    };

                    this.launchRaid = function () {
                        //  The raiders hold formation with the rest of the swarm and
                        //  then drop as one, a beat apart so they arrive as a stream
                        //  rather than a wall.
                        const squadron = this.invaders.getChildren().filter(
                            invader => invader.isRaider && invader.active &&
                                       !invader.isDiving && !invader.isDoomed
                        );
                        if (squadron.length === 0) {
                            return;
                        }

                        squadron.sort((a, b) => a.x - b.x);
                        squadron.forEach((raider, index) => {
                            this.time.delayedCall(index * 130, () => {
                                if (this.isGameOver || !raider.active || raider.isDiving) {
                                    return;
                                }
                                raider.isDiving = true;
                                raider.setDepth(7);
                                this.playSfx('sfx_dive', 0.5);
                                this.physics.moveTo(raider, this.player.x, this.player.y, raider.diveSpeed);
                            });
                        });
                    };

                    this.hitPlayerByInvader = function (objA, objB) {
                        const ship = (objA === this.player) ? objA : objB;
                        const invader = (ship === objA) ? objB : objA;

                        if (!ship || !ship.active || !invader || !invader.active || !invader.isDiving) {
                            return;
                        }

                        const x = invader.x;
                        const y = invader.y;
                        invader.destroy();

                        const boom = this.add.sprite(x, y, 'explosion');
                        boom.setDisplaySize(64, 64);
                        boom.setDepth(8);
                        boom.play('explode');
                        boom.once('animationcomplete', () => boom.destroy());

                        if (this.time.now < this.shieldUntil) {
                            this.shieldSpark(x, y);
                            return;
                        }

                        if (this.time.now < this.playerHitUntil) {
                            return;
                        }

                        this.lives -= 1;
                        this.livesText.setText('Lives: ' + this.lives);
                        this.playerHitUntil = this.time.now + 250;
                        this.playSfx('sfx_player_hit', 0.8);

                        if (this.lives <= 0) {
                            this.gameOver();
                        }
                    };

                    this.changeLevel = function (delta) {
                        //  Debug helper: jump straight to any level to inspect its difficulty.
                        const target = Phaser.Math.Clamp(this.level + delta, 1, 99);
                        if (target === this.level) {
                            return;
                        }

                        if (this.isGameOver) {
                            //  Lift the game-over state so the jumped-to level is playable.
                            this.isGameOver = false;
                            this.physics.resume();
                            this.gameOverTexts.forEach(text => text.destroy());
                            this.gameOverTexts = [];
                            this.lives = Math.max(1, this.lives);
                            this.livesText.setText('Lives: ' + this.lives);
                        }

                        this.startLevel(target);
                    };

                    this.spawnBonusShip = function () {
                        const fromLeft = Phaser.Math.Between(0, 1) === 0;
                        const ship = this.add.sprite(fromLeft ? -40 : this.viewW + 40, this.bonusY, 'bonus_ship');
                        ship.setDisplaySize(60, 24);
                        ship.setDepth(6);
                        this.physics.add.existing(ship);
                        this.bonusShips.add(ship);
                        ship.body.setAllowGravity(false);
                        ship.body.setVelocityX((fromLeft ? 130 : -130) * this.speedX);
                        this.startSaucerSound();
                    };

                    this.hitBonusShip = function (objA, objB) {
                        const saucer = this.bonusShips.contains(objA) ? objA : objB;
                        const bullet = (saucer === objA) ? objB : objA;

                        if (!saucer || !saucer.active || !bullet || !bullet.active) {
                            return;
                        }

                        const x = saucer.x;
                        const y = saucer.y;
                        const points = Phaser.Utils.Array.GetRandom([50, 100, 150, 300]);

                        bullet.destroy();
                        saucer.destroy();
                        this.score += points;
                        this.scoreText.setText('Score: ' + this.score);
                        this.stopSaucerSound();
                        this.playSfx('sfx_saucer_die', 0.7);

                        const boom = this.add.sprite(x, y, 'explosion');
                        boom.setDisplaySize(64, 64);
                        boom.setDepth(6);
                        boom.play('explode');
                        boom.once('animationcomplete', () => boom.destroy());

                        this.floatLabel(x, y, '+' + points, '#ffdd33');

                        //  The saucer always pays out a capsule as well.
                        this.dropPowerUp(x, y);
                    };

                    this.floatLabel = function (x, y, text, colour) {
                        const label = this.add.text(x, y, text, {
                            fontFamily: FONT_DISPLAY,
                            fontSize: displaySize(22) + 'px',
                            fill: colour,
                            stroke: '#000000',
                            strokeThickness: 4
                        });
                        label.setOrigin(0.5);
                        label.setDepth(100);
                        this.tweens.add({
                            targets: label,
                            y: y - 34,
                            alpha: 0,
                            duration: 900,
                            onComplete: () => label.destroy()
                        });
                    };

                    this.attachGiftGlow = function (capsule, index) {
                        //  A soft, additive halo in the capsule's own colour. It is a
                        //  separate sprite so it can pulse without touching the capsule.
                        const glow = this.add.sprite(capsule.x, capsule.y, 'powerup_glow');
                        glow.setDisplaySize(58, 58);
                        glow.setTint(this.POWER_TINTS[index]);
                        glow.setBlendMode(Phaser.BlendModes.ADD);
                        glow.setAlpha(0.6);
                        glow.setDepth(6);
                        glow.owner = capsule;
                        this.powerGlows.push(glow);

                        this.tweens.add({
                            targets: glow,
                            alpha: 1,
                            scale: glow.scaleX * 1.22,
                            duration: 620,
                            yoyo: true,
                            repeat: -1
                        });
                    };

                    this.dropPowerUp = function (x, y) {
                        //  Weighted pick so the strong gifts show up less often.
                        const total = this.POWER_WEIGHTS.reduce((sum, weight) => sum + weight, 0);
                        let roll = Phaser.Math.Between(1, total);
                        let index = 0;
                        while (roll > this.POWER_WEIGHTS[index]) {
                            roll -= this.POWER_WEIGHTS[index];
                            index += 1;
                        }

                        const capsule = this.add.sprite(x, y, 'powerup', index);
                        capsule.powerType = this.POWER_TYPES[index];
                        capsule.setDisplaySize(30, 30);
                        capsule.setDepth(7);
                        this.physics.add.existing(capsule);
                        this.powerUps.add(capsule);
                        capsule.body.setAllowGravity(false);
                        capsule.body.setVelocityY(95 * this.speedY);
                        this.attachGiftGlow(capsule, index);
                    };

                    this.dropAllGifts = function () {
                        //  Debug helper: one of every capsule, fanned out across the board
                        //  and stacked above the top edge so they arrive one at a time.
                        if (this.isGameOver) {
                            return;
                        }

                        const margin = this.viewW * 0.125;
                        const spread = (this.viewW - margin * 2) / (this.POWER_TYPES.length - 1);

                        this.POWER_TYPES.forEach((type, index) => {
                            const x = margin + index * spread;
                            const capsule = this.add.sprite(x, 20 - index * 70, 'powerup', index);
                            capsule.powerType = type;
                            capsule.setDisplaySize(30, 30);
                            capsule.setDepth(7);
                            this.physics.add.existing(capsule);
                            this.powerUps.add(capsule);
                            capsule.body.setAllowGravity(false);
                            capsule.body.setVelocityY(95 * this.speedY);
                            this.attachGiftGlow(capsule, index);
                        });
                    };

                    this.collectPowerUp = function (objA, objB) {
                        const capsule = this.powerUps.contains(objA) ? objA : objB;
                        if (!capsule || !capsule.active || !this.player.active) {
                            return;
                        }

                        const type = capsule.powerType;
                        capsule.destroy();
                        this.playSfx('sfx_powerup', 0.5);
                        this.applyPowerUp(type);
                    };

                    this.applyPowerUp = function (type) {
                        const now = this.time.now;
                        const x = this.player.x;
                        const y = this.player.y - 40;

                        if (type === 'rapid') {
                            this.rapidUntil = now + 8000;
                            this.floatLabel(x, y, 'RAPID FIRE', '#ffbe28');
                        } else if (type === 'multi') {
                            this.multiUntil = now + 10000;
                            this.floatLabel(x, y, 'TRIPLE SHOT', '#ff7828');
                        } else if (type === 'laser') {
                            this.fireLaser();
                            this.floatLabel(x, y, 'LASER', '#ff3c3c');
                        } else if (type === 'life') {
                            this.lives = Math.min(5, this.lives + 1);
                            this.livesText.setText('Lives: ' + this.lives);
                            this.playSfx('sfx_extra_life', 0.8);
                            this.floatLabel(x, y, '+1 LIFE', '#3ce66e');
                        } else if (type === 'twin') {
                            this.twinUntil = now + 12000;
                            this.spawnWingman();
                            this.floatLabel(x, y, 'TWIN SHIP', '#46c8ff');
                        } else if (type === 'push') {
                            this.pushInvadersBack();
                            this.playSfx('sfx_push', 0.7);
                            this.floatLabel(x, y, 'PUSH BACK', '#b478ff');
                        } else if (type === 'nuke') {
                            this.nukeInvaders();
                            this.floatLabel(x, y, 'MEGA BOMB', '#ff46be');
                        } else if (type === 'shield') {
                            this.shieldUntil = now + 7000;
                            this.raiseForceField();
                            this.playSfx('sfx_force_field', 0.7);
                            this.floatLabel(x, y, 'FORCE FIELD', '#c8d7eb');
                        } else if (type === 'scramble') {
                            this.scrambleInvaders();
                            this.playSfx('sfx_scramble', 0.6);
                            this.floatLabel(x, y, 'SCRAMBLE', '#3cdcbe');
                        }
                    };

                    this.raiseForceField = function () {
                        //  A bubble that burns up anything that touches it. Re-collecting
                        //  the capsule just extends the timer on the existing bubble.
                        if (this.forceField) {
                            return;
                        }

                        const bubble = this.add.sprite(this.player.x, this.player.y, 'force_field');
                        bubble.setDisplaySize(88, 88);
                        bubble.setDepth(9);
                        //  Additive blending makes the rim glow against the dark sky
                        //  while leaving the ship visible through the middle.
                        bubble.setBlendMode(Phaser.BlendModes.ADD);
                        bubble.baseScale = bubble.scaleX;
                        this.forceField = bubble;
                        this.tweens.add({
                            targets: bubble,
                            scale: bubble.baseScale * 1.07,
                            alpha: { from: 0.75, to: 1 },
                            duration: 520,
                            yoyo: true,
                            repeat: -1
                        });
                        this.tweens.add({
                            targets: bubble,
                            angle: 360,
                            duration: 6000,
                            repeat: -1
                        });
                    };

                    this.dropForceField = function () {
                        if (!this.forceField) {
                            return;
                        }

                        const bubble = this.forceField;
                        this.forceField = null;
                        this.tweens.killTweensOf(bubble);
                        this.tweens.add({
                            targets: bubble,
                            alpha: 0,
                            scale: bubble.baseScale * 1.4,
                            duration: 260,
                            onComplete: () => bubble.destroy()
                        });
                    };

                    this.shieldSpark = function (x, y) {
                        const spark = this.add.circle(x, y, 7, 0xaaddff, 0.9);
                        spark.setDepth(10);
                        this.playSfx('sfx_spark', 0.45);
                        this.tweens.add({
                            targets: spark,
                            alpha: 0,
                            scale: 2,
                            duration: 220,
                            onComplete: () => spark.destroy()
                        });
                    };

                    this.pushInvadersBack = function () {
                        //  Shoves the whole swarm back to the row it started the level on
                        //  and aborts any dive already in progress.
                        let raidersLeft = 0;
                        this.invaders.getChildren().forEach(invader => {
                            if (!invader.active) return;

                            if (invader.isRaider) {
                                raidersLeft += 1;
                            }
                            if (invader.isDiving) {
                                invader.isDiving = false;
                                invader.setDepth(0);
                            }
                            if (invader.body) {
                                invader.body.setVelocity(0, 0);
                            }

                            const targetY = invader.homeY;
                            if (invader.y <= targetY) return;

                            this.tweens.add({
                                targets: invader,
                                y: targetY,
                                duration: 420,
                                ease: 'Back.easeOut',
                                onUpdate: () => {
                                    if (invader.body) invader.body.updateFromGameObject();
                                },
                                onComplete: () => {
                                    if (invader.body) invader.body.updateFromGameObject();
                                }
                            });
                        });

                        //  The survivors of the squadron regroup and try again.
                        if (raidersLeft > 0) {
                            this.raidAt = this.time.now + 3000;
                        }
                    };

                    this.scrambleInvaders = function () {
                        //  Re-forms the swarm: the survivors are packed into a gap-free
                        //  block at the front of the formation, then shuffled so every
                        //  invader lands in a different slot than it started in.
                        const movers = this.invaders.getChildren().filter(
                            invader => invader.active && !invader.isDiving &&
                                       !invader.isDoomed && !invader.isRaider
                        );
                        if (movers.length < 2) {
                            return;
                        }

                        const spacing = this.gridStep;
                        const cols = this.gridCols;
                        const ref = movers[0];

                        //  The whole block marches and drops together, so any invader
                        //  gives the current origin of the grid it belongs to.
                        const originX = ref.x - ref.col * spacing;
                        const originY = ref.y - ref.row * spacing;
                        const homeOriginY = ref.homeY - ref.row * spacing;

                        const fullRows = Math.floor(movers.length / cols);
                        const remainder = movers.length % cols;
                        const slots = [];

                        for (let row = 0; row < fullRows; row++) {
                            for (let col = 0; col < cols; col++) {
                                slots.push({ row: row, col: col });
                            }
                        }
                        if (remainder > 0) {
                            //  A partial row is centred so the block stays symmetrical.
                            const offset = (cols - remainder) / 2;
                            for (let i = 0; i < remainder; i++) {
                                slots.push({ row: fullRows, col: offset + i });
                            }
                        }

                        //  Closing the gaps can push the block off the side it drifted
                        //  to, so slide it back inside the marching bounds.
                        const columns = slots.map(slot => slot.col);
                        const leftX = originX + Math.min.apply(null, columns) * spacing;
                        const rightX = originX + Math.max.apply(null, columns) * spacing;
                        const leftLimit = this.marchLeft + 20;
                        const rightLimit = this.marchRight - 20;
                        let shift = 0;
                        if (leftX < leftLimit) {
                            shift = (leftLimit - leftX) / spacing;
                        } else if (rightX > rightLimit) {
                            shift = (rightLimit - rightX) / spacing;
                        }

                        slots.forEach(slot => {
                            slot.col += shift;
                            slot.x = originX + slot.col * spacing;
                            slot.y = originY + slot.row * spacing;
                            slot.homeY = homeOriginY + slot.row * spacing;
                        });

                        Phaser.Utils.Array.Shuffle(slots);

                        const hops = movers.map((invader, index) => {
                            const slot = slots[index];
                            invader.row = slot.row;
                            invader.col = slot.col;
                            invader.homeY = slot.homeY;
                            return {
                                invader: invader,
                                dx: slot.x - invader.x,
                                dy: slot.y - invader.y
                            };
                        });

                        //  The offsets are applied as deltas rather than absolute
                        //  positions so the swarm keeps marching while it reshuffles.
                        const progress = { p: 0 };
                        let last = 0;
                        this.tweens.add({
                            targets: progress,
                            p: 1,
                            duration: 520,
                            ease: 'Cubic.easeInOut',
                            onUpdate: () => {
                                const step = progress.p - last;
                                last = progress.p;
                                hops.forEach(hop => {
                                    const invader = hop.invader;
                                    if (!invader.active || invader.isDiving) return;

                                    invader.x += hop.dx * step;
                                    invader.y += hop.dy * step;
                                    if (invader.body) {
                                        invader.body.updateFromGameObject();
                                    }
                                });
                            }
                        });
                    };

                    this.nukeInvaders = function () {
                        //  Wipes the screen: every invader is doomed, but they cook off
                        //  one by one over the next couple of seconds.
                        const flash = this.add.rectangle(
                            this.viewW / 2, this.viewH / 2, this.viewW, this.viewH, 0xffffff
                        );
                        flash.setDepth(50);
                        flash.setAlpha(0.75);
                        this.playSfx('sfx_nuke', 1);
                        this.tweens.add({
                            targets: flash,
                            alpha: 0,
                            duration: 450,
                            onComplete: () => flash.destroy()
                        });

                        this.invaderBullets.clear(true, true);

                        this.invaders.getChildren().slice().forEach(invader => {
                            if (!invader.active || invader.isDoomed) return;

                            //  Doomed invaders stop diving, shooting and being picked on.
                            invader.isDoomed = true;
                            invader.isDiving = false;
                            invader.setDepth(0);
                            invader.setTint(0xff6688);
                            if (invader.body) {
                                invader.body.setVelocity(0, 0);
                            }

                            this.time.delayedCall(Phaser.Math.Between(500, 2000), () => {
                                if (!invader.active) return;

                                const boom = this.add.sprite(invader.x, invader.y, 'explosion');
                                boom.setDisplaySize(60, 60);
                                boom.setDepth(51);
                                boom.play('explode');
                                boom.once('animationcomplete', () => boom.destroy());

                                const points = invader.points || 10 * (invader.maxHp || 1);
                                invader.destroy();
                                this.score += points;
                                this.scoreText.setText('Score: ' + this.score);
                            });
                        });
                    };

                    this.fireLaser = function () {
                        //  Vaporises everything in the column directly above the ship.
                        const beamHeight = this.player.y - 30;
                        this.playSfx('sfx_laser', 0.9);
                        const beam = this.add.sprite(this.player.x, beamHeight / 2, 'laser_beam');
                        beam.setDisplaySize(18, beamHeight);
                        beam.setDepth(9);
                        this.tweens.add({
                            targets: beam,
                            alpha: 0,
                            duration: 320,
                            onComplete: () => beam.destroy()
                        });

                        const reach = 20;
                        let killed = 0;
                        let points = 0;

                        this.invaders.getChildren().slice().forEach(invader => {
                            if (!invader.active) return;
                            if (Math.abs(invader.x - this.player.x) > reach + invader.displayWidth / 2) return;

                            const boom = this.add.sprite(invader.x, invader.y, 'explosion');
                            boom.setDisplaySize(52, 52);
                            boom.setDepth(5);
                            boom.play('explode');
                            boom.once('animationcomplete', () => boom.destroy());
                            points += invader.points || 10 * (invader.maxHp || 1);
                            invader.destroy();
                            killed += 1;
                        });

                        this.invaderBullets.getChildren().slice().forEach(bullet => {
                            if (bullet.active && Math.abs(bullet.x - this.player.x) <= reach) {
                                bullet.destroy();
                            }
                        });

                        if (killed > 0) {
                            this.score += points;
                            this.scoreText.setText('Score: ' + this.score);
                        }
                    };

                    this.spawnWingman = function () {
                        if (this.wingmen.countActive() > 0) {
                            return;   //  already flying: the timer above just got extended
                        }

                        //  Dock the wingman on whichever side has more room.
                        const offsetX = (this.player.x > this.viewW / 2) ? -70 : 70;
                        const wingman = this.add.sprite(this.player.x + offsetX, this.player.y, 'player');
                        wingman.offsetX = offsetX;
                        wingman.setDisplaySize(60, 20);
                        wingman.setTint(0x00ffff);
                        wingman.setDepth(10);
                        this.physics.add.existing(wingman);
                        this.wingmen.add(wingman);
                        wingman.body.setAllowGravity(false);
                        wingman.body.setImmovable(true);
                        //  The wingman is flown by hand every frame, so arcade physics
                        //  must not integrate it as well: left to itself it writes a
                        //  stale position back over ours and the ship judders.
                        wingman.body.moves = false;
                    };

                    this.hitWingman = function (objA, objB) {
                        //  The wingman soaks one hit instead of the player losing a life.
                        const wingman = this.wingmen.contains(objA) ? objA : objB;
                        const bullet = (wingman === objA) ? objB : objA;

                        if (!wingman || !wingman.active || !bullet || !bullet.active) {
                            return;
                        }

                        const x = wingman.x;
                        const y = wingman.y;
                        bullet.destroy();
                        wingman.destroy();

                        const boom = this.add.sprite(x, y, 'explosion');
                        boom.setDisplaySize(56, 56);
                        boom.setDepth(10);
                        boom.play('explode');
                        boom.once('animationcomplete', () => boom.destroy());
                    };

                    this.firePlayerBullet = function (x, y, velocityX) {
                        const bullet = this.add.sprite(x, y, 'bullet_player');
                        bullet.setDisplaySize(4, 12);
                        this.physics.add.existing(bullet);
                        this.bullets.add(bullet);
                        bullet.body.setVelocity(velocityX * this.speedX, -300 * this.speedY);
                        bullet.body.setAllowGravity(false);
                    };

                    this.fireVolley = function () {
