                        const spread = (this.time.now < this.multiUntil) ? [-110, 0, 110] : [0];
                        const shooters = [this.player].concat(
                            this.wingmen.getChildren().filter(wingman => wingman.active)
                        );

                        this.playSfx('sfx_shoot', 0.45);

                        shooters.forEach(ship => {
                            spread.forEach(velocityX => {
                                this.firePlayerBullet(ship.x, ship.y - 20, velocityX);
                            });
                        });
                    };

                    this.hitPlayer = function (objA, objB) {
                        //  Phaser 3.55 invokes overlap(group, sprite) callbacks as (sprite, groupChild),
                        //  so resolve which argument is the ship and which is the bullet.
                        const ship = (objA === this.player) ? objA : objB;
                        const bullet = (ship === objA) ? objB : objA;

                        if (!ship || !ship.active || !bullet || !bullet.active) {
                            return;
                        }

                        bullet.destroy();

                        if (this.time.now < this.shieldUntil) {
                            this.shieldSpark(bullet.x, bullet.y);
                            return;
                        }

                        if (this.time.now < this.playerHitUntil) {
                            return;
                        }

                        this.lives -= 1;
                        this.livesText.setText('Lives: ' + this.lives);
                        this.playerHitUntil = this.time.now + 250;
                        this.playSfx('sfx_player_hit', 0.8);

                        if (this.lives <= 0) {
                            this.gameOver();
                        }
                    };

                    this.gameOver = function () {
                        if (this.isGameOver) {
                            return;
                        }
                        this.isGameOver = true;

                        this.physics.pause();
                        this.pointerActive = false;
                        this.stopSaucerSound();
                        this.playSfx('sfx_game_over', 0.9);
                        this.player.setTint(0xff0000);

                        const rank = HIGH_SCORES.submit(this.score, this.level);

                        const gameOverText = this.add.text(this.viewW / 2, this.viewH / 2 - 40, 'GAME OVER', { fontFamily: FONT_DISPLAY, fontSize: displaySize(48) + 'px', fill: '#ff0000', stroke: '#000000', strokeThickness: 5 });
                        gameOverText.setOrigin(0.5);
                        gameOverText.setDepth(100);

                        //  Making the board is the good news, so it gets the loud
                        //  line; otherwise the run is measured against the best.
                        let verdict = 'score ' + this.score + '     best ' + HIGH_SCORES.best();
                        let verdictColour = '#ffffff';
                        if (rank === 1) {
                            verdict = 'NEW HIGH SCORE     ' + this.score;
                            verdictColour = '#ffdd55';
                        } else if (rank > 1) {
                            verdict = 'HIGH SCORE  #' + rank + '     ' + this.score;
                            verdictColour = '#8cffcd';
                        }
                        const verdictText = this.add.text(this.viewW / 2, this.viewH / 2 + 20, verdict, { fontFamily: FONT_DISPLAY, fontSize: displaySize(24) + 'px', fill: verdictColour, stroke: '#000000', strokeThickness: 4 });
                        verdictText.setOrigin(0.5);
                        verdictText.setDepth(100);

                        const promptText = this.add.text(this.viewW / 2, this.viewH / 2 + 70, 'tap or press a key for the menu', { fontFamily: FONT_BODY, fontSize: bodySize(22) + 'px', fill: '#fff', stroke: '#000000', strokeThickness: 3 });
                        promptText.setOrigin(0.5);
                        promptText.setDepth(100);

                        const countText = this.add.text(this.viewW / 2, this.viewH / 2 + 106, '', { fontFamily: FONT_BODY, fontSize: bodySize(18) + 'px', fill: '#88ddff', stroke: '#000000', strokeThickness: 3 });
                        countText.setOrigin(0.5);
                        countText.setDepth(100);

                        this.gameOverTexts = [gameOverText, verdictText, promptText, countText];

                        //  The run is finished, so the start page takes over again:
                        //  straight away if the player asks, otherwise once the
                        //  scoreline has had a few seconds to sink in. Every route
                        //  rechecks the flag, so the debug level jumper can cancel
                        //  the whole thing simply by resuming play.
                        const leave = () => {
                            if (this.isGameOver) {
                                this.quitToMenu();
                            }
                        };

                        let waiting = 6;
                        countText.setText('back to the menu in ' + waiting);
                        this.time.addEvent({
                            delay: 1000,
                            repeat: waiting - 1,
                            callback: () => {
                                waiting -= 1;
                                if (!this.isGameOver) {
                                    return;
                                }
                                if (waiting > 0) {
                                    countText.setText('back to the menu in ' + waiting);
                                } else {
                                    leave();
                                }
                            }
                        });

                        ['keydown-ENTER', 'keydown-SPACE', 'keydown-R'].forEach(event => {
                            this.input.keyboard.once(event, leave);
                        });
                        //  The tap that killed the player must not count as the
                        //  answer, so the touch handler arms itself a beat later.
                        this.time.delayedCall(700, () => {
                            if (this.isGameOver) {
                                this.input.once('pointerdown', leave);
                            }
                        });
                    };

                    this.pickArmourSlots = function (rows, cols) {
                        //  Armour arrives a few invaders at a time instead of whole
                        //  lines: either the two flanks of a row or its middle, filling
                        //  the front row first and creeping backwards from there.
                        const slots = {};
                        let remaining = Math.min(this.armourCount, rows * cols);
                        if (remaining <= 0) {
                            return slots;
                        }

                        const middle = (cols - 1) / 2;
                        const order = [];
                        for (let col = 0; col < cols; col++) {
                            order.push(col);
                        }
                        order.sort((a, b) => {
                            const da = Math.abs(a - middle);
                            const db = Math.abs(b - middle);
                            return this.armourPattern === 'centre' ? da - db : db - da;
                        });

                        for (let row = 0; row < rows && remaining > 0; row++) {
                            for (let i = 0; i < order.length && remaining > 0; i++) {
                                slots[row + ',' + order[i]] = true;
                                remaining -= 1;
                            }
                        }
                        return slots;
                    };

                    this.spawnInvaders = function () {
                        const invaderSize = 40;
                        const startX = this.gridLeft;
                        const startY = this.gridTop;
                        const rows = this.gridRows;
                        const cols = this.gridCols;
                        const rowTextures = ['invader_a', 'invader_b', 'invader_b', 'invader_c', 'invader_c'];
                        const armourSlots = this.pickArmourSlots(rows, cols);

                        for (let row = 0; row < rows; row++) {
                            for (let col = 0; col < cols; col++) {
                                const x = startX + col * this.gridStep;
                                const y = startY + row * this.gridStep;
                                const key = rowTextures[row];
                                const invader = this.add.sprite(x, y, key);
                                invader.setDisplaySize(invaderSize, invaderSize);
                                invader.homeY = y;
                                invader.row = row;
                                invader.col = col;
                                invader.hp = armourSlots[row + ',' + col] ? 2 : 1;
                                invader.maxHp = invader.hp;
                                invader.play(key + '_fly');
                                this.paintInvader(invader);
                                //  The wave materialises row by row instead of popping in.
                                invader.setAlpha(0);
                                this.tweens.add({
                                    targets: invader,
                                    alpha: 1,
                                    duration: 260,
                                    delay: (row * cols + col) * 8
                                });
                                this.invaders.add(invader);
                                this.physics.add.existing(invader);
                                invader.body.setAllowGravity(false);
                                invader.body.setImmovable(true);
                            }
                        }
                    };

                    this.spawnRaiders = function () {
                        //  A short squadron rides one row above the swarm, marching in
                        //  formation with it until their timer runs out.
                        const count = this.raiderCount;
                        if (count <= 0) {
                            return;
                        }

                        const y = this.gridTop - this.gridStep;
                        const centre = this.gridLeft + (this.gridCols - 1) * this.gridStep / 2;
                        const startX = centre - (count - 1) * this.gridStep / 2;

                        for (let i = 0; i < count; i++) {
                            const raider = this.add.sprite(startX + i * this.gridStep, y, 'invader_d');
                            raider.setDisplaySize(40, 40);
                            raider.homeY = y;
                            raider.row = -1;
                            raider.col = i;
                            raider.hp = 1;
                            raider.maxHp = 1;
                            raider.isRaider = true;
                            raider.points = 30;
                            raider.diveSpeed = this.raidSpeed;
                            raider.play('invader_d_fly');
                            raider.setAlpha(0);
                            this.tweens.add({
                                targets: raider,
                                alpha: 1,
                                duration: 260,
                                delay: 200 + i * 40
                            });
                            this.invaders.add(raider);
                            this.physics.add.existing(raider);
                            raider.body.setAllowGravity(false);
                            raider.body.setImmovable(true);
                        }
                    };

                    this.startLevel = function (level) {
                        //  Jumping straight to a level cancels any transition in flight.
                        if (this.levelTimer) {
                            this.levelTimer.remove(false);
                            this.levelTimer = null;
                        }
                        this.isTransitioning = false;

                        this.level = level;
                        this.levelText.setText('Level: ' + level);

                        //  Difficulty ramps gently: roughly a 20% step per level rather
                        //  than a doubling, so early levels stay comfortable.
                        this.invaderSpeed = (30 + (level - 1) * 7) * this.speedX;
                        this.invaderDropDistance = (16 + Math.floor((level - 1) / 2) * 2) * this.dropScale;
                        this.invaderBulletSpeed = (200 + (level - 1) * 15) * this.speedY;
                        this.invaderFireMin = Math.max(280, 850 - (level - 1) * 55);
                        this.invaderFireMax = Math.max(700, 1900 - (level - 1) * 120);
                        this.invaderDirection = 1;
                        this.nextInvaderFire = this.time.now + 800;

                        //  Cover thins out every third level, divers arrive at level 3.
                        this.shieldCount = Math.max(1, 4 - Math.floor((level - 1) / 3));
                        this.shieldBlockHp = level >= 7 ? 1 : 2;
                        //  Armour starts at level 2 and only creeps up by two invaders
                        //  per level, alternating between the flanks and the middle.
                        this.armourCount = Math.max(0, Math.min(50, (level - 1) * 2));
                        this.armourPattern = level % 2 === 0 ? 'sides' : 'centre';
                        this.maxDivers = level < 3 ? 0 : Math.min(3, 1 + Math.floor((level - 3) / 3));
                        this.diveSpeed = (120 + (level - 1) * 12) * this.speedY;
                        this.diveInterval = Math.max(2200, 7000 - (level - 1) * 400);
                        this.nextDiveAt = this.time.now + this.diveInterval;

                        //  Raiders show up from level 2, a couple more every other
                        //  level, and they wait a little less each time before they
                        //  drop on the player.
                        this.raiderCount = level < 2 ? 0 : Math.min(7, 2 + Math.floor((level - 1) / 2));
                        this.raidSpeed = (170 + (level - 1) * 14) * this.speedY;
                        this.raidDelay = Math.max(2600, 6500 - (level - 1) * 300);
                        this.raidAt = this.raiderCount > 0 ? this.time.now + this.raidDelay : 0;

                        this.bullets.clear(true, true);
                        this.invaderBullets.clear(true, true);
                        this.invaders.clear(true, true);
                        this.bonusShips.clear(true, true);
                        this.powerUps.clear(true, true);
                        this.stopSaucerSound();
                        this.nextBonusAt = this.time.now + Phaser.Math.Between(5000, 9000);
                        this.marchStep = 0;
                        this.nextMarchBeat = this.time.now + 900;
                        this.spawnInvaders();
                        this.spawnRaiders();
                        this.spawnShields();
                        this.playSfx('sfx_level_start', 0.7);

                        const banner = this.add.text(this.viewW / 2, this.viewH * 0.43, 'LEVEL ' + level, {
                            fontFamily: FONT_DISPLAY,
                            fontSize: displaySize(44) + 'px',
                            fill: '#00ff00',
                            stroke: '#000000',
                            strokeThickness: 6
                        });
                        banner.setOrigin(0.5);
                        banner.setDepth(100);
                        banner.setScale(0.3);
                        banner.setAlpha(0);

                        if (this.levelBanner) {
                            this.tweens.killTweensOf(this.levelBanner);
                            this.levelBanner.destroy();
                        }
                        this.levelBanner = banner;

                        //  Punch in, hold for a beat, then zoom out of the way.
                        this.tweens.add({
                            targets: banner,
                            scale: 1,
                            alpha: 1,
                            ease: 'Back.easeOut',
                            duration: 380
                        });
                        this.tweens.add({
                            targets: banner,
                            alpha: 0,
                            scale: 1.6,
                            delay: 900,
                            duration: 420,
                            onComplete: () => {
                                if (this.levelBanner === banner) {
                                    this.levelBanner = null;
                                }
                                banner.destroy();
                            }
                        });

                        if (this.debugText) {
                            this.debugText.setText(
                                'DEBUG  bunkers ' + this.shieldCount +
                                ' (' + this.shieldBlockHp + 'hp)' +
                                '   armour ' + this.armourCount + ' ' + this.armourPattern +
                                '   divers ' + this.maxDivers +
                                ' @ ' + this.diveSpeed + 'px/s' +
                                '   raiders ' + this.raiderCount +
                                ' @ ' + Math.round(this.raidDelay / 100) / 10 + 's' +
                                '   fire ' + this.invaderFireMin + '-' + this.invaderFireMax + 'ms' +
                                '   march ' + Math.round(this.invaderSpeed)
                            );
                        }

                        if (this.levelLabel) {
                            this.levelLabel.textContent = 'Level ' + level;
                        }
                    };

                    this.beginLevelTransition = function () {
                        //  Victory lap: the sky is swept clean, the clear banner plays,
                        //  and only then does the next wave arrive.
                        if (this.isTransitioning || this.isGameOver) {
                            return;
                        }
                        this.isTransitioning = true;

                        this.invaderBullets.clear(true, true);
                        this.stopSaucerSound();
                        this.playSfx('sfx_wave_clear', 0.8);

                        const wash = this.add.rectangle(
                            this.viewW / 2, this.viewH / 2, this.viewW, this.viewH, 0x00ff88, 0.16
                        );
                        wash.setDepth(49);
                        this.tweens.add({
                            targets: wash,
                            alpha: 0,
                            duration: 700,
                            onComplete: () => wash.destroy()
                        });

                        const clearedY = this.viewH * 0.42;
                        const cleared = this.add.text(this.viewW / 2, clearedY, 'WAVE ' + this.level + ' CLEARED', {
                            fontFamily: FONT_DISPLAY,
                            fontSize: displaySize(40) + 'px',
                            fill: '#8cffcd',
                            stroke: '#000000',
                            strokeThickness: 6
                        });
                        cleared.setOrigin(0.5);
                        cleared.setDepth(100);
                        cleared.setScale(0.4);
                        cleared.setAlpha(0);
                        this.tweens.add({
                            targets: cleared,
                            scale: 1,
                            alpha: 1,
                            ease: 'Back.easeOut',
                            duration: 420
                        });
                        this.tweens.add({
                            targets: cleared,
                            alpha: 0,
                            y: clearedY - 40,
                            delay: 900,
                            duration: 400,
                            onComplete: () => cleared.destroy()
                        });

                        this.levelTimer = this.time.delayedCall(1500, () => {
                            this.levelTimer = null;
                            this.isTransitioning = false;
                            if (!this.isGameOver) {
                                this.nextLevel();
                            }
                        });
                    };

                    this.nextLevel = function () {
                        this.startLevel(this.level + 1);
                    };

                    this.player = null;
                    this.invaders = null;
                    this.bullets = null;
                    this.invaderBullets = null;
                    this.shields = null;
                    this.bonusShips = null;
                    this.powerUps = null;
                    this.wingmen = null;
                    this.powerText = null;
                    this.rapidUntil = 0;
                    this.multiUntil = 0;
                    this.twinUntil = 0;
                    this.shieldUntil = 0;
                    this.forceField = null;
                    this.POWER_TYPES = POWERUPS.map(gift => gift.type);
                    //  Drop odds: the screen-clearing bomb has to stay rare.
                    this.POWER_WEIGHTS = POWERUPS.map(gift => gift.weight);
                    //  Halo colours, matching the capsule artwork.
                    this.POWER_TINTS = POWERUPS.map(gift => gift.tint);
                    this.powerGlows = [];
                    this.nextBonusAt = 0;
                    this.marchStep = 0;
                    this.nextMarchBeat = 0;
                    this.shieldCount = 4;
                    this.shieldBlockHp = 2;
                    this.armourCount = 0;
                    this.armourPattern = 'sides';
                    this.ARMOUR_TINT = 0xff9a3c;
                    this.maxDivers = 0;
                    this.diveSpeed = 130;
                    this.diveInterval = 6000;
                    this.nextDiveAt = 0;
                    this.raiderCount = 0;
                    this.raidSpeed = 180;
                    this.raidDelay = 6000;
                    this.raidAt = 0;
                    this.debugText = null;
                    this.gameOverTexts = [];
                    this.cursors = null;
                    this.spaceKey = null;
                    this.score = 0;
                    this.scoreText = null;
                    this.lives = 3;
                    this.livesText = null;
                    this.playerHitUntil = 0;
                    this.isGameOver = false;
                    this.leavingToMenu = false;
                    this.level = 1;
                    this.levelText = null;
                    this.levelBanner = null;
                    this.isTransitioning = false;
                    this.levelTimer = null;
                    this.invaderSpeed = 30;
                    this.invaderDirection = 1;
                    this.invaderDropDistance = 18;
                    this.invaderBulletSpeed = 200;
                    this.invaderFireMin = 800;
                    this.invaderFireMax = 1800;
                    this.nextInvaderFire = 0;
                    this.lastFired = 0;

                    //  The sky is 4:3 artwork, so it is scaled to cover the board and
                    //  cropped rather than stretched: stars stay square in portrait.
                    SKY.add(this, this.viewW, this.viewH);

                    //  Animations live on the game, not the scene, so they survive a
                    //  restart and only ever need building once.
                    ['invader_a', 'invader_b', 'invader_c', 'invader_d'].forEach(key => {
                        if (this.anims.exists(key + '_fly')) {
                            return;
                        }
                        this.anims.create({
                            key: key + '_fly',
                            frames: this.anims.generateFrameNumbers(key, { start: 0, end: 1 }),
                            frameRate: key === 'invader_d' ? 6 : 2,
                            repeat: -1
                        });
                    });

                    if (!this.anims.exists('explode')) {
                        this.anims.create({
                            key: 'explode',
                            frames: this.anims.generateFrameNumbers('explosion', { start: 0, end: 4 }),
                            frameRate: 24
                        });
                    }

                    this.player = this.add.sprite(this.viewW / 2, this.playerY, 'player');
                    this.player.setDisplaySize(60, 20);
                    this.player.setTint(0x00ff00);
                    this.player.setVisible(true);
                    this.player.setAlpha(1);
                    this.player.setDepth(10);
                    this.physics.add.existing(this.player);
                    this.player.body.setAllowGravity(false);
                    this.player.body.setImmovable(true);

                    this.invaders = this.physics.add.group({ runChildUpdate: true });

                    this.bullets = this.physics.add.group({ runChildUpdate: true });
                    this.invaderBullets = this.physics.add.group({ runChildUpdate: true });
                    this.shields = this.physics.add.group();
                    this.bonusShips = this.physics.add.group();
                    this.powerUps = this.physics.add.group();
                    this.wingmen = this.physics.add.group();

                    this.cursors = this.input.keyboard.createCursorKeys();
                    this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

                    //  ---- touch controls ------------------------------------------
                    //  Drag anywhere to slide the cannon and hold to keep firing.  The
                    //  drag is relative to where the finger went down, so it never has
                    //  to sit on top of the ship.
                    this.pointerActive = false;
                    this.pointerX = 0;
                    this.dragOffset = 0;

                    this.input.on('pointerdown', pointer => {
                        if (this.isGameOver) {
                            return;
                        }
                        this.pointerActive = true;
                        this.pointerX = pointer.x;
                        this.dragOffset = Phaser.Math.Clamp(this.player.x - pointer.x, -160, 160);
                    });
                    this.input.on('pointermove', pointer => {
                        if (pointer.isDown) {
                            this.pointerX = pointer.x;
                        }
                    });
                    this.input.on('pointerup', () => {
                        this.pointerActive = false;
                    });

                    const hudStyle = {
                        fontFamily: FONT_DISPLAY,
                        fontSize: displaySize(24) + 'px',
                        fill: '#fff',
                        stroke: '#000000',
                        strokeThickness: 4
                    };

                    this.scoreText = this.add.text(16, 16, 'Score: 0', hudStyle);
                    this.livesText = this.add.text(16, 50, 'Lives: 3', hudStyle);
                    this.levelText = this.add.text(this.viewW - 16, 16, 'Level: 1', hudStyle);
                    this.levelText.setOrigin(1, 0);

                    this.scoreText.setDepth(100);
                    this.livesText.setDepth(100);
                    this.levelText.setDepth(100);

                    this.powerText = this.add.text(this.viewW - 16, 50, '', {
                        fontFamily: FONT_DISPLAY,
                        fontSize: displaySize(16) + 'px',
                        fill: '#ffdd55',
                        stroke: '#000000',
                        strokeThickness: 4
                    });
                    this.powerText.setOrigin(1, 0);
                    this.powerText.setDepth(100);

                    //  ---- debug level stepper -------------------------------------
                    //  The +/- controls are plain DOM buttons sitting under the board:
                    //  they stay clickable no matter what the canvas input is doing, and
                    //  tabindex="-1" plus blur() keeps SPACE firing the cannon, not a button.
                    //  None of it exists unless the page was opened with ?debug=true.
                    this.levelLabel = DEBUG ? document.getElementById('level-label') : null;
                    const soundButton = DEBUG ? document.getElementById('toggle-sound') : null;

                    if (DEBUG) {
                        const wireButton = (id, delta) => {
                            //  Assigning onclick (rather than addEventListener) keeps a single
                            //  handler when create() runs again after a restart.
                            document.getElementById(id).onclick = event => {
                                event.currentTarget.blur();
                                this.changeLevel(delta);
                            };
                        };
                        wireButton('level-up', 1);
                        wireButton('level-down', -1);

                        document.getElementById('drop-gifts').onclick = event => {
                            event.currentTarget.blur();
                            this.dropAllGifts();
                        };
                    }

                    this.toggleSound = function () {
                        this.sound.mute = !this.sound.mute;
                        SETTINGS.set('muted', this.sound.mute);
                        if (soundButton) {
                            soundButton.textContent = this.sound.mute ? 'sound off' : 'sound on';
                        }
                    };
                    if (soundButton) {
                        soundButton.textContent = this.sound.mute ? 'sound off' : 'sound on';
                        soundButton.onclick = event => {
                            event.currentTarget.blur();
                            this.toggleSound();
                        };
                    }

                    this.input.keyboard.on('keydown', event => {
                        if (event.key === 'm' || event.key === 'M') {
                            this.toggleSound();
                        } else if (!DEBUG) {
                            return;
                        } else if (event.key === '+' || event.key === '=') {
                            this.changeLevel(1);
                        } else if (event.key === '-' || event.key === '_') {
                            this.changeLevel(-1);
                        } else if (event.key === 'g' || event.key === 'G') {
                            this.dropAllGifts();
                        }
                    });

                    //  A game in progress can always be abandoned back to the menu.
                    this.input.keyboard.on('keydown-ESC', () => this.quitToMenu());

                    if (DEBUG) {
                        this.debugText = this.add.text(16, this.viewH - 22, '', {
                            fontFamily: FONT_BODY,
                            fontSize: bodySize(13) + 'px',
                            fill: '#88ddff',
                            stroke: '#000000',
                            strokeThickness: 3,
                            wordWrap: { width: this.viewW - 32 }
                        });
                        this.debugText.setOrigin(0, 1);
                        this.debugText.setDepth(100);
                    }
                    //  --------------------------------------------------------------

                    this.startLevel(1);

                    this.physics.add.overlap(this.bullets, this.invaders, this.hitInvader, null, this);
                    this.physics.add.overlap(this.invaderBullets, this.player, this.hitPlayer, null, this);
                    this.physics.add.overlap(this.bullets, this.shields, this.hitShield, null, this);
                    this.physics.add.overlap(this.invaderBullets, this.shields, this.hitShield, null, this);
                    this.physics.add.overlap(this.invaders, this.shields, this.crushShield, null, this);
                    this.physics.add.overlap(this.invaders, this.player, this.hitPlayerByInvader, null, this);
                    this.physics.add.overlap(this.bullets, this.bonusShips, this.hitBonusShip, null, this);
                    this.physics.add.overlap(this.powerUps, this.player, this.collectPowerUp, null, this);
                    this.physics.add.overlap(this.powerUps, this.wingmen, this.collectPowerUp, null, this);
                    this.physics.add.overlap(this.invaderBullets, this.wingmen, this.hitWingman, null, this);
                },
                update: function (time, delta) {
                    //  The sky keeps drifting even on the game over screen.
                    SKY.drift(this, delta);

                    if (this.isGameOver || !this.player || !this.player.active) {
                        return;
                    }

                    this.player.setVisible(true);
                    this.player.setAlpha(1);
                    this.player.setDepth(10);
                    if (this.time.now < this.playerHitUntil) {
                        this.player.setTint(0xff0000);
                    } else {
                        this.player.setTint(0x00ff00);
                    }

                    //  A pointer released outside the canvas never fires 'pointerup',
                    //  so the held state is re-checked every frame.
                    if (this.pointerActive && !this.input.activePointer.isDown) {
                        this.pointerActive = false;
                    }

                    const minX = 30;
                    const maxX = this.viewW - 30;
                    const moveStep = 4 * this.speedX;

                    if (this.pointerActive) {
                        this.player.x = Phaser.Math.Clamp(this.pointerX + this.dragOffset, minX, maxX);
                    } else if (this.cursors.left.isDown) {
                        this.player.x -= moveStep;
                        if (this.player.x < minX) this.player.x = minX;
                    } else if (this.cursors.right.isDown) {
                        this.player.x += moveStep;
                        if (this.player.x > maxX) this.player.x = maxX;
                    }

                    //  Wingman flies in formation with the player until its timer runs out.
                    if (this.wingmen.countActive() > 0 && time > this.twinUntil) {
                        this.wingmen.clear(true, true);
                    }
                    this.wingmen.children.each(wingman => {
                        if (!wingman || !wingman.active) return;
                        wingman.x = Phaser.Math.Clamp(this.player.x + wingman.offsetX, minX, maxX);
                        wingman.y = this.player.y;
                        if (wingman.body) {
                            wingman.body.updateFromGameObject();
                        }
                    });

                    //  Force field rides with the ship and vaporises shots at its edge.
                    if (this.forceField) {
                        this.forceField.x = this.player.x;
                        this.forceField.y = this.player.y;

                        if (time > this.shieldUntil) {
                            this.dropForceField();
                        } else {
                            this.invaderBullets.getChildren().slice().forEach(bullet => {
                                if (!bullet.active) return;
                                const distance = Phaser.Math.Distance.Between(
                                    bullet.x, bullet.y, this.player.x, this.player.y
                                );
                                if (distance <= 44) {
                                    this.shieldSpark(bullet.x, bullet.y);
                                    bullet.destroy();
                                }
                            });
                        }
                    }

                    const fireDelay = (time < this.rapidUntil) ? 110 : 250;
                    if ((this.spaceKey.isDown || this.pointerActive) && time > this.lastFired) {
                        this.fireVolley();
                        this.lastFired = time + fireDelay;
                    }

                    this.bullets.children.each(bullet => {
                        if (bullet.y < 0 || bullet.x < -20 || bullet.x > this.viewW + 20) {
                            bullet.destroy();
                        }
                    });

                    this.powerUps.children.each(capsule => {
                        if (capsule && capsule.active && capsule.y > this.viewH + 20) {
                            capsule.destroy();
                        }
                    });

                    //  Halos ride along with their capsule and die with it.
                    this.powerGlows = this.powerGlows.filter(glow => {
                        if (!glow.owner || !glow.owner.active) {
                            this.tweens.killTweensOf(glow);
                            glow.destroy();
                            return false;
                        }
                        glow.x = glow.owner.x;
                        glow.y = glow.owner.y;
                        return true;
                    });

                    const powers = [];
                    if (time < this.rapidUntil) powers.push('RAPID ' + Math.ceil((this.rapidUntil - time) / 1000));
                    if (time < this.multiUntil) powers.push('TRIPLE ' + Math.ceil((this.multiUntil - time) / 1000));
                    if (this.wingmen.countActive() > 0) powers.push('TWIN ' + Math.ceil((this.twinUntil - time) / 1000));
                    if (time < this.shieldUntil) powers.push('SHIELD ' + Math.ceil((this.shieldUntil - time) / 1000));
                    this.powerText.setText(powers.join('   '));

                    this.invaderBullets.children.each(bullet => {
                        if (bullet.y > this.viewH) {
                            bullet.destroy();
                        }
                    });

                    this.bonusShips.children.each(saucer => {
                        if (saucer && saucer.active && (saucer.x < -70 || saucer.x > this.viewW + 70)) {
                            saucer.destroy();
                        }
                    });

                    if (this.saucerSound && this.bonusShips.countActive() === 0) {
                        this.stopSaucerSound();
                    }

                    if (this.bonusShips.countActive() === 0 && time > this.nextBonusAt) {
                        this.spawnBonusShip();
                        this.nextBonusAt = time + Phaser.Math.Between(9000, 15000);
                    }

                    const invaderStep = this.invaderDirection * (this.invaderSpeed * delta / 1000);
                    let hitEdge = false;

                    this.invaders.children.each(invader => {
                        if (!invader || !invader.active) return;

                        if (invader.isDiving) {
                            //  Divers steer for the player until they commit to the run.
                            if (invader.y < this.playerY - 90) {
                                this.physics.moveTo(invader, this.player.x, this.player.y,
                                                    invader.diveSpeed || this.diveSpeed);
                            }
                            if (invader.y > this.viewH + 40) {
                                invader.destroy();
                            }
                            return;
                        }

                        invader.x += invaderStep;
                        if (invader.body) {
                            invader.body.updateFromGameObject();
                        }

                        const leftEdge = invader.x - invader.displayWidth / 2;
                        const rightEdge = invader.x + invader.displayWidth / 2;
                        if (this.invaderDirection === 1 && rightEdge > this.marchRight) {
                            hitEdge = true;
                        } else if (this.invaderDirection === -1 && leftEdge < this.marchLeft) {
                            hitEdge = true;
                        }

                        if (invader.y + invader.displayHeight / 2 >= this.player.y - 10) {
                            this.gameOver();
                        }
                    });

                    if (hitEdge) {
                        this.invaderDirection *= -1;
                        this.invaders.children.each(invader => {
                            if (invader && invader.active && !invader.isDiving) {
                                invader.y += this.invaderDropDistance;
                                if (invader.body) {
                                    invader.body.updateFromGameObject();
                                }
                            }
                        });
                        this.invaderSpeed += this.speedX;
                    }

                    if (this.raidAt > 0 && time > this.raidAt) {
                        this.raidAt = 0;
                        this.launchRaid();
                    }

                    if (this.maxDivers > 0 && time > this.nextDiveAt) {
                        const diving = this.invaders.getChildren().filter(
                            invader => invader.active && invader.isDiving
                        ).length;
                        if (diving < this.maxDivers) {
                            this.launchDiver();
                            this.nextDiveAt = time + this.diveInterval;
                        }
                    }

                    if (time > this.nextInvaderFire) {
                        this.fireInvaderBullet();
                        this.nextInvaderFire = time + Phaser.Math.Between(this.invaderFireMin, this.invaderFireMax);
                    }

                    //  The marching heartbeat: four notes on a loop that tightens up
                    //  as the swarm is whittled down.
                    const marching = this.invaders.countActive();
                    if (marching > 0 && !this.isTransitioning && time > this.nextMarchBeat) {
                        this.playSfx('sfx_march_' + this.marchStep, 0.4);
                        this.marchStep = (this.marchStep + 1) % 4;
                        const fraction = marching / (this.gridRows * this.gridCols);
                        this.nextMarchBeat = time + Phaser.Math.Linear(180, 620, fraction);
                    }

                    if (!this.isTransitioning && this.invaders.countActive() === 0) {
                        this.beginLevelTransition();
                    }
                }
            }]
        };

        //  Phaser bakes text into canvas the moment a scene draws it, so a face
        //  that arrives late would leave the menu stuck in the fallback font.
        //  Both are asked for up front, and the game waits - but not for ever.
        const fontsReady = (document.fonts && document.fonts.load)
            ? Promise.race([
                Promise.all([
                    document.fonts.load('16px "Jaro"'),
                    document.fonts.load('16px "Outfit"')
                ]),
                new Promise(resolve => setTimeout(resolve, 3000))
            ])
            : Promise.resolve();

        fontsReady.then(() => {
            const game = new Phaser.Game(config);

            if (DEBUG) {
                //  Handy hook for poking at the running game from the console.
                window.game = game;
            }
        });
    </script>
</body>
</html>
